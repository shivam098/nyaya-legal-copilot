<body class="min-h-screen antialiased selection:bg-amber-100">
  <div id="root"></div>

  <script src="/vendor/sanscript.js"></script>
  <script type="text/babel" data-type="module">
    import { createVoiceInput, appendTranscript, voiceAvailability, VOICE_LANGUAGES, INITIAL_VOICE_STATE } from '/voice-input.mjs';
    const { useState, useEffect, useRef } = React;

    function useVoiceInput() {
      const [state, setState] = useState(INITIAL_VOICE_STATE);
      const [target, setTarget] = useState(null);
      const controller = useRef(null);
      const textSetter = useRef(null);
      const speechConsent = useRef(false);

      useEffect(() => {
        const input = createVoiceInput({
          onState: setState,
          onText: text => textSetter.current?.(previous => appendTranscript(previous, text))
        });
        controller.current = input;
        const stopWhenHidden = () => {
          if (document.hidden) input.cancel('Voice input stopped because the page was hidden.');
        };
        const stopOnPageLeave = () => input.cancel('Voice input stopped because the page was left.');
        document.addEventListener('visibilitychange', stopWhenHidden);
        window.addEventListener('pagehide', stopOnPageLeave);
        return () => {
          input.dispose();
          document.removeEventListener('visibilitychange', stopWhenHidden);
          window.removeEventListener('pagehide', stopOnPageLeave);
        };
      }, []);

      return {
        state,
        target,
        busy: state.phase !== 'idle',
        isActive: () => Boolean(controller.current?.active),
        start(id, setter, language) {
          if (controller.current?.active) return;
          if (!speechConsent.current) {
            const agreed = window.confirm(
              "Use voice input?\n\nYour browser's speech service may send audio off your device. Nyaya does not record or store audio. Hindi and Hinglish are shown in English letters; recognition accuracy varies. You can edit the text before submitting.\n\nAllow browser speech processing?"
            );
            if (!agreed) return;
            speechConsent.current = true;
          }
          textSetter.current = setter;
          setTarget(id);
          controller.current?.start({ language, consent: speechConsent.current });
        },
        stop: () => controller.current?.stop(),
        reset() {
          controller.current?.cancel();
          textSetter.current = null;
          setTarget(null);
          setState(INITIAL_VOICE_STATE);
        }
      };
    }

    function VoiceInput({ inputId, setText, voice, disabled, compact = false }) {
      const [language, setLanguage] = useState('en-IN');
      const unavailable = voiceAvailability();
      const selected = voice.target === inputId;
      const active = selected && voice.busy;
      const state = selected ? voice.state : INITIAL_VOICE_STATE;
      const statusId = `${inputId}-voice-status`;
      if (compact) {
        const showStatus = selected && (state.message || state.error || state.interim);
        return (
          <div class="flex items-center gap-1">
            <select value={language} onChange={event => setLanguage(event.target.value)} aria-label="Speech language"
              disabled={voice.busy || disabled || Boolean(unavailable)}
              class="h-10 w-[4.25rem] rounded-full border border-zinc-200 bg-white pl-2.5 pr-1 text-xs text-zinc-600 disabled:opacity-50 focus:outline-none">
              {VOICE_LANGUAGES.map(item => <option key={item.code} value={item.code} title={item.label}>{({ 'en-IN': 'EN', 'hi-IN': 'हि', hinglish: 'Hing' })[item.code] || item.label}</option>)}
            </select>
            <button type="button" aria-controls={inputId} aria-describedby={showStatus ? statusId : undefined} aria-pressed={active}
              aria-label={active ? 'Stop voice input' : 'Start voice input'}
              title={unavailable || (active ? 'Stop voice input' : 'Speak instead of typing')}
              onClick={() => active ? voice.stop() : voice.start(inputId, setText, language)}
              disabled={active ? state.phase === 'stopping' : disabled || voice.busy || Boolean(unavailable)}
              class={`w-10 h-10 rounded-full flex items-center justify-center text-base transition disabled:opacity-40 ${active ? 'bg-red-600 text-white animate-pulse' : 'hover:bg-zinc-100 text-zinc-600'}`}>
              {state.phase === 'stopping' ? '…' : active ? '■' : '🎤'}
            </button>
            {showStatus && (
              <div id={statusId} role="status" aria-live="polite" class="voice-compact-status">
                {state.error ? <span class="text-red-800 font-medium">{state.error} Existing text has not been removed.</span>
                  : state.interim ? <span><span class="font-medium">Hearing: </span>{state.interim}</span>
                  : state.message}
              </div>
            )}
          </div>
        );
      }
      return (
        <div class="rounded-xl border border-zinc-200 bg-zinc-50 p-3 space-y-3">
          <div class="flex flex-col sm:flex-row sm:items-center gap-3">
            <div class="flex-1 text-sm font-semibold text-zinc-800">Explain by voice</div>
            <label class="min-w-0 text-xs text-zinc-600 flex flex-col sm:flex-row sm:items-center gap-2">
              Speech language
              <select value={language} onChange={event => setLanguage(event.target.value)}
                disabled={voice.busy || disabled || Boolean(unavailable)}
                class="min-h-[44px] w-full sm:w-auto rounded-lg border border-zinc-300 bg-white px-2 text-sm disabled:opacity-50">
                {VOICE_LANGUAGES.map(item => <option key={item.code} value={item.code}>{item.label}</option>)}
              </select>
            </label>
            <button type="button" aria-controls={inputId} aria-describedby={unavailable || state.message ? statusId : undefined} aria-pressed={active}
              onClick={() => active ? voice.stop() : voice.start(inputId, setText, language)}
              disabled={active ? state.phase === 'stopping' : disabled || voice.busy || Boolean(unavailable)}
              class={`min-h-[44px] px-4 py-2 rounded-xl text-sm font-semibold transition disabled:opacity-50 ${active ? 'bg-red-700 text-white hover:bg-red-800' : 'bg-zinc-900 text-white hover:bg-zinc-800'}`}>
              {state.phase === 'stopping' ? 'Finishing transcription...' : active ? 'Stop voice input' : 'Start voice input'}
            </button>
          </div>
          {(unavailable || state.message) && (
            <p id={statusId} role="status" aria-live="polite" class={`text-xs leading-relaxed ${active ? 'text-red-800 font-medium' : 'text-zinc-600'}`}>
              {unavailable || state.message}
            </p>
          )}
          {state.error && <p role="alert" class="text-xs text-red-800 font-medium">{state.error} Existing text has not been removed.</p>}
          {state.interim && <p class="text-sm text-zinc-600 break-words"><span class="font-medium">Live transcript (English letters, not yet confirmed): </span>{state.interim}</p>}
        </div>
      );
    }

    function sanitizeHtml(rawHtml = '') {
      return String(rawHtml || '')
        .replace(/<script[\s\S]*?<\/script>/gi, '')
        .replace(/<iframe[\s\S]*?<\/iframe>/gi, '')
        .replace(/<object[\s\S]*?<\/object>/gi, '')
        .replace(/<embed[\s\S]*?>/gi, '')
        .replace(/<style[\s\S]*?<\/style>/gi, '')
        .replace(/<link[\s\S]*?>/gi, '')
        .replace(/<meta[\s\S]*?>/gi, '')
        .replace(/\son[a-z]+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '')
        .replace(/(href|src|xlink:href)\s*=\s*(?:"\s*(?:javascript|vbscript|data:text\/html)[^"]*"|'\s*(?:javascript|vbscript|data:text\/html)[^']*')/gi, '$1="#"');
    }

    const ACT_URL_DIRECTORY = [
      { rx: /\b(ndps|narcotic\s+drugs)\b/i, name: 'NDPS Act 1985', url: 'https://www.indiacode.nic.in/handle/123456789/1791' },
      { rx: /\b(bsa|bharatiya\s+sakshya)\b/i, name: 'Bharatiya Sakshya Adhiniyam 2023', url: 'https://www.indiacode.nic.in/handle/123456789/20063' },
      { rx: /\b(iea|indian\s+evidence\s+act)\b/i, name: 'Indian Evidence Act 1872', url: 'https://indiankanoon.org/doc/1953529/' },
      { rx: /\b(bnss|bharatiya\s+nagarik\s+suraksha)\b/i, name: 'BNSS 2023', url: 'https://www.indiacode.nic.in/handle/123456789/20099' },
      { rx: /\b(bns\b|bharatiya\s+nyaya\s+sanhita)\b/i, name: 'BNS 2023', url: 'https://www.indiacode.nic.in/handle/123456789/20062' },
      { rx: /\b(crpc|criminal\s+procedure)\b/i, name: 'Code of Criminal Procedure 1973', url: 'https://indiankanoon.org/doc/445276/' },
      { rx: /\b(ipc|indian\s+penal\s+code)\b/i, name: 'Indian Penal Code 1860', url: 'https://indiankanoon.org/doc/1569253/' },
      { rx: /\b(consumer\s+protection|cpa)\b/i, name: 'Consumer Protection Act 2019', url: 'https://www.indiacode.nic.in/handle/123456789/15256' },
      { rx: /\b(rera|real\s+estate)\b/i, name: 'RERA Act 2016', url: 'https://www.indiacode.nic.in/handle/123456789/2158' },
      { rx: /\b(hindu\s+succession|hsa)\b/i, name: 'Hindu Succession Act 1956', url: 'https://www.indiacode.nic.in/handle/123456789/1549' },
      { rx: /\b(pwdva|domestic\s+violence)\b/i, name: 'Protection of Women from Domestic Violence Act 2005', url: 'https://www.indiacode.nic.in/handle/123456789/2059' },
      { rx: /\b(negotiable\s+instruments|ni\s+act)\b/i, name: 'Negotiable Instruments Act 1881', url: 'https://www.indiacode.nic.in/handle/123456789/2189' },
      { rx: /\b(companies\s+act)\b/i, name: 'Companies Act 2013', url: 'https://www.indiacode.nic.in/handle/123456789/2114' },
      { rx: /\b(cpc|civil\s+procedure)\b/i, name: 'Code of Civil Procedure 1908', url: 'https://www.indiacode.nic.in/handle/123456789/2191' }
    ];

    function resolveActMeta(text = '') {
      for (const item of ACT_URL_DIRECTORY) {
        if (item.rx.test(text)) return item;
      }
      return null;
    }

    function enrichLegalReferencesHtml(sanitizedHtml = '') {
      if (!sanitizedHtml || typeof document === 'undefined') return sanitizedHtml;
      try {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = sanitizedHtml;

        // 1. Ensure all existing links open in a new tab with external indicator
        wrapper.querySelectorAll('a[href]').forEach(a => {
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener noreferrer');
          if (!a.textContent.includes('↗')) {
            a.textContent = `${a.textContent.trim()} ↗`;
          }
        });

        // 2. Enrich tables: make Act cells, Section cells, and unlinked/placeholder ("Same") Link cells clickable!
        wrapper.querySelectorAll('table').forEach(table => {
          let lastActName = '';
          let lastActUrl = 'https://www.indiacode.nic.in/';

          table.querySelectorAll('tbody tr').forEach(row => {
            const cells = row.querySelectorAll('td');
            if (cells.length < 2) return;

            const actCell = cells[0];
            const sectionCell = cells[1];
            const rawActText = (actCell.textContent || '').trim();
            const actMeta = resolveActMeta(rawActText) || resolveActMeta(sectionCell.textContent || '');

            if (actMeta) {
              lastActName = actMeta.name;
              lastActUrl = actMeta.url;
            } else if (rawActText && !/^(same|ditto|"|-)$/i.test(rawActText)) {
              lastActName = rawActText;
              lastActUrl = `https://indiankanoon.org/search/?formInput=${encodeURIComponent(rawActText)}`;
            }

            // Make Column 1 (Act) clickable if it has no <a> yet
            if (!actCell.querySelector('a') && rawActText) {
              const actQueryUrl = actMeta
                ? actMeta.url
                : `https://indiankanoon.org/search/?formInput=${encodeURIComponent(lastActName || rawActText)}`;
              actCell.innerHTML = `<a href="${actQueryUrl}" target="_blank" rel="noopener noreferrer">${actCell.innerHTML.trim()} ↗</a>`;
            }

            // Make Column 2 (Section) clickable to the exact Section + Act on Indian Kanoon if it has no <a> yet
            const rawSecText = (sectionCell.textContent || '').trim();
            if (!sectionCell.querySelector('a') && rawSecText) {
              const primarySec = rawSecText.match(/(?:Sections?\s+\d+[A-Za-z0-9()\s&–-]*|Order\s+[IVXLC0-9]+\s+Rules?\s+[0-9\s&–-]*)/i)?.[0] || rawSecText.slice(0, 45);
              const searchUrl = `https://indiankanoon.org/search/?formInput=${encodeURIComponent(`${primarySec} ${lastActName}`.trim())}`;
              sectionCell.innerHTML = `<a href="${searchUrl}" target="_blank" rel="noopener noreferrer" title="Read ${primarySec} (${lastActName})">${sectionCell.innerHTML.trim()} ↗</a>`;
            }

            // If there is a 4th column (e.g. "IndiaCode Link") where the LLM wrote "Same" or plain text without an <a>, make it a real clickable link!
            if (cells.length >= 4) {
              const linkCell = cells[cells.length - 1];
              const linkText = (linkCell.textContent || '').trim();
              if (!linkCell.querySelector('a') && linkText) {
                const cellMeta = resolveActMeta(linkText);
                const targetUrl = cellMeta ? cellMeta.url : lastActUrl;
                const displayLabel = /^(same|ditto)$/i.test(linkText)
                  ? `📘 ${lastActName.split(' ')[0] || 'Bare'} Act ↗`
                  : `📘 ${linkText} ↗`;
                linkCell.innerHTML = `<a href="${targetUrl}" target="_blank" rel="noopener noreferrer">${displayLabel}</a>`;
              }
            }
          });
        });

        // 3. Auto-link unlinked SCC / INSC citations and standalone "Section X of the Y Act" in paragraphs & list items
        const textContainers = wrapper.querySelectorAll('p, li');
        textContainers.forEach(el => {
          if (el.querySelector('a')) return;
          let html = el.innerHTML;
          // Link SCC citations like (2021) 4 SCC 1 or (2020) 5 SCC 757
          html = html.replace(
            /(\(\d{4}\)\s+\d+\s+SCC\s+\d+)/g,
            (m) => `<a href="https://indiankanoon.org/search/?formInput=${encodeURIComponent(m)}" target="_blank" rel="noopener noreferrer">${m} ↗</a>`
          );
          // Link "Section X of the <Act>" or "Section X NDPS Act / BSA / BNSS / BNS / IPC / CrPC / CPA / RERA"
          html = html.replace(
            /\b(Sections?\s+\d+[A-Za-z0-9()]*(?:\s*(?:&|and|to)\s*\d+[A-Za-z0-9()]*)?\s+(?:of\s+the\s+)?(?:NDPS\s+Act|Indian\s+Evidence\s+Act|IEA|Bharatiya\s+Sakshya\s+Adhiniyam|BSA|BNSS|BNS|CrPC|IPC|Consumer\s+Protection\s+Act|CPA|RERA\s+Act|Hindu\s+Succession\s+Act|PWDVA|NI\s+Act|Companies\s+Act)(?:,\s*\d{4})?)/gi,
            (m) => `<a href="https://indiankanoon.org/search/?formInput=${encodeURIComponent(m)}" target="_blank" rel="noopener noreferrer">${m} ↗</a>`
          );
          if (html !== el.innerHTML) {
            el.innerHTML = html;
          }
        });

        return wrapper.innerHTML;
      } catch {
        return sanitizedHtml;
      }
    }

    function renderFormattedMarkdown(mdText) {
      if (!mdText) return { __html: '' };
      const cleanedMd = String(mdText).replace(/<nyaya_intake_meta>[\s\S]*$/i, '').trim();
      if (window.marked && typeof window.marked.parse === 'function') {
        const clean = sanitizeHtml(window.marked.parse(cleanedMd, { breaks: true, gfm: true }));
        return { __html: enrichLegalReferencesHtml(clean) };
      }
      return { __html: enrichLegalReferencesHtml(sanitizeHtml(cleanedMd).replace(/\n/g, '<br/>')) };
    }

    /**
     * Downscales high-res phone photos/screenshots (e.g. 4000x3000px, 5MB) to max 1100px JPEG
     * on an offscreen canvas so the browser DOM never freezes and API uploads stay fast (<120KB/image).
     */
    function compressAndResizeImageFile(file, maxDim = 1100) {
      return new Promise((resolve) => {
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
          URL.revokeObjectURL(objectUrl);
          resolve(dataUrl);
        };
        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          const reader = new FileReader();
          reader.onload = (ev) => resolve(ev.target?.result || '');
          reader.readAsDataURL(file);
        };
        img.src = objectUrl;
      });
    }

    function readTextFileAsync(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (ev) => resolve(String(ev.target?.result || '').slice(0, 18000));
        reader.onerror = () => resolve('');
        reader.readAsText(file);
      });
    }

    function readFileAsBase64Async(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const res = String(ev.target?.result || '');
          const idx = res.indexOf(',');
          resolve(idx !== -1 ? res.slice(idx + 1) : res);
        };
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);
      });
    }

    function ShareConversationSheet({ sessionId, buildAuthHeaders, onClose }) {
      const [expiresInDays, setExpiresInDays] = useState(7);
      const [includeDocuments, setIncludeDocuments] = useState(false);
      const [recipientLabel, setRecipientLabel] = useState('');
      const [link, setLink] = useState('');
      const [shares, setShares] = useState([]);
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState('');

      const loadShares = async () => {
        try {
          const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/shares`, { headers: buildAuthHeaders() });
          const data = await res.json();
          if (res.ok) setShares(data.shares || []);
        } catch {
          // ignore
        }
      };
      useEffect(() => { loadShares(); }, [sessionId]);

      const createLink = async () => {
        setBusy(true);
        setMessage('');
        try {
          const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/shares`, {
            method: 'POST',
            headers: buildAuthHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ expiresInDays, includeDocuments, recipientLabel })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Could not create the link');
          setLink(`${window.location.origin}${data.sharePath}`);
          setShares(data.shares || []);
        } catch (err) {
          setMessage(err.message);
        } finally {
          setBusy(false);
        }
      };

      const revoke = async (shareId) => {
        try {
          const res = await fetch(`/api/shares/${encodeURIComponent(shareId)}`, { method: 'DELETE', headers: buildAuthHeaders() });
          const data = await res.json();
          if (res.ok) setShares(data.shares || []);
        } catch {
          // ignore
        }
      };

      const shareText = `I'd like your view on my legal matter. Here is my conversation with Nyaya (read-only): ${link}`;
      const copyLink = async () => {
        try {
          await navigator.clipboard.writeText(link);
          setMessage('✓ Link copied');
          setTimeout(() => setMessage(''), 2000);
        } catch {
          setMessage('Copy failed — select the link and copy it manually.');
        }
      };
      const nativeShare = async () => {
        try {
          await navigator.share({ title: 'My Nyaya conversation', text: shareText, url: link });

          // user cancelled
        }
      };

        <div class="rounded-2xl border border-zinc-200 bg-white p-4 space-y-3 text-sm shadow-sm">

              <div class="text-xs text-zinc-500">They get a read-only copy of this conversation so far. They can't edit it or see your later messages.</div>

          </div>

          {!link && (
            <div class="space-y-2.5">
              <input
                type="text"
                value={recipientLabel}
                onChange={(e) => setRecipientLabel(e.target.value)}
                placeholder="Who is this for? (optional, e.g. Adv. Sharma)"
                class="w-full text-sm px-3 py-2 rounded-xl border border-zinc-200 bg-zinc-50 focus:outline-none focus:border-zinc-400"
              />
              <div class="flex flex-wrap items-center gap-2 text-xs">
                <span class="text-zinc-500">Link works for</span>
                {[1, 7, 30].map(d => (
                  <button key={d} type="button" onClick={() => setExpiresInDays(d)}
                    class={`px-3 py-1.5 rounded-full border ${expiresInDays === d ? 'bg-zinc-900 text-white border-zinc-900' : 'border-zinc-200 text-zinc-700 hover:border-zinc-400'}`}>
                    {d === 1 ? '1 day' : `${d} days`}

                ))}
              </div>
              <label class="flex items-start gap-2 text-xs text-zinc-600 cursor-pointer">

                <span>Also include text from documents I uploaded (orders, notices, chats). Leave off if they contain private details you don't want to share.</span>
              </label>
              <button type="button" onClick={createLink} disabled={busy}

                {busy ? 'Creating link…' : 'Create share link'}
              </button>
            </div>
          )}

          {link && (
            <div class="space-y-2.5">
              <input readOnly value={link} onFocus={(e) => e.target.select()} aria-label="Share link"
                class="w-full text-xs px-3 py-2 rounded-xl border border-zinc-200 bg-zinc-50 text-zinc-700" />
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs font-medium">
                <button type="button" onClick={copyLink} class="h-10 rounded-full bg-zinc-900 text-white hover:bg-zinc-800">📋 Copy link</button>
                <a href={`https://wa.me/?text=${encodeURIComponent(shareText)}`} target="_blank" rel="noopener noreferrer"
                  class="h-10 rounded-full border border-emerald-300 bg-emerald-50 text-emerald-900 flex items-center justify-center hover:bg-emerald-100">WhatsApp</a>
                <a href={`mailto:?subject=${encodeURIComponent('My legal matter — Nyaya conversation')}&body=${encodeURIComponent(shareText)}`}
                  class="h-10 rounded-full border border-zinc-200 flex items-center justify-center hover:border-zinc-400">✉️ Email</a>
                {typeof navigator !== 'undefined' && navigator.share
                  ? <button type="button" onClick={nativeShare} class="h-10 rounded-full border border-zinc-200 hover:border-zinc-400">⋯ More apps</button>
                  : <button type="button" onClick={() => setLink('')} class="h-10 rounded-full border border-zinc-200 hover:border-zinc-400">＋ New link</button>}
              </div>
              <p class="text-[11px] text-zinc-500">Anyone with this link can read the conversation until it expires. You can turn it off below at any time.</p>
            </div>
          )}

          {message && <p class="text-xs text-zinc-600">{message}</p>}

          {shares.length > 0 && (
            <details class="text-xs" open={shares.some(s => s.active) && !link}>
              <summary class="cursor-pointer font-medium text-zinc-500">Your links for this conversation ({shares.filter(s => s.active).length} active)</summary>
              <ul class="mt-2 divide-y divide-zinc-100 border border-zinc-100 rounded-xl">
                {shares.map(s => (
                  <li key={s.id} class="flex items-center justify-between gap-2 px-3 py-2">
                    <div class="min-w-0">
                      <div class="text-zinc-800 truncate">{s.recipientLabel || 'Share link'} · up to question {s.uptoTurnIndex}</div>
                      <div class="text-[11px] text-zinc-500">
                        {s.active ? `Expires ${formatShareDate(s.expiresAt)}` : s.revokedAt ? 'Turned off' : 'Expired'}
                        {' · '}{s.viewCount ? `opened ${s.viewCount}×, last ${formatShareDate(s.lastViewedAt)}` : 'not opened yet'}
                        {s.includeDocuments ? ' · with documents' : ''}
                      </div>
                    </div>
                    {s.active && <button type="button" onClick={() => revoke(s.id)} class="shrink-0 px-3 py-1.5 rounded-full border border-red-200 text-red-700 hover:bg-red-50">Turn off</button>}
                  </li>
                ))}
              </ul>
            </details>
          )}
        </div>
      );
    }

    /**

     */
    function AdminInteractionLog({ buildAuthHeaders }) {
      const [filters, setFilters] = useState({ q: '', authState: '', status: '', reviewStatus: '', rating: '', domain: '' });
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [offset, setOffset] = useState(0);
      const [detail, setDetail] = useState(null);
      const [review, setReview] = useState({ reviewStatus: 'unreviewed', tags: [], note: '' });
      const [saving, setSaving] = useState(false);
      const PAGE = 25;

      const queryString = (extra = {}) => {
        const p = new URLSearchParams();
        Object.entries({ ...filters, ...extra }).forEach(([k, v]) => {
          if (v !== '' && v !== null && v !== undefined) p.set(k, v);
        });
        return p.toString();
      };

      const load = async (nextOffset = 0) => {
        setLoading(true);
        setError('');
        try {
          const res = await fetch(`/api/admin/logs?${queryString({ limit: PAGE, offset: nextOffset })}`, { headers: buildAuthHeaders() });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Could not load the interaction log');
          setData(json);
          setOffset(nextOffset);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };
      useEffect(() => { load(0); }, [filters.authState, filters.status, filters.reviewStatus, filters.rating, filters.domain]);

      const openDetail = async (id) => {
        try {
          const res = await fetch(`/api/admin/logs/${encodeURIComponent(id)}`, { headers: buildAuthHeaders() });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Could not open this interaction');
          setDetail(json.entry);
          setReview({ reviewStatus: json.entry.reviewStatus, tags: json.entry.reviewTags || [], note: json.entry.reviewNote || '' });
        } catch (err) {
          setError(err.message);
        }
      };

      const saveReview = async () => {
        if (!detail) return;
        setSaving(true);
        try {
          const res = await fetch(`/api/admin/logs/${encodeURIComponent(detail.id)}`, {
            method: 'PATCH',
            headers: buildAuthHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify(review)
          });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Could not save the review');
          setDetail(json.entry);
          setReview({ reviewStatus: json.entry.reviewStatus, tags: json.entry.reviewTags || [], note: json.entry.reviewNote || '' });
          setData(prev => prev ? { ...prev, entries: prev.entries.map(e => e.id === json.entry.id ? { ...e, reviewStatus: json.entry.reviewStatus, reviewTags: json.entry.reviewTags } : e) } : prev);
        } catch (err) {
          setError(err.message);
        } finally {
          setSaving(false);
        }
      };

      const exportJsonl = async () => {
        try {
          const res = await fetch(`/api/admin/logs/export?${queryString()}`, { headers: buildAuthHeaders() });
          if (!res.ok) throw new Error('Export failed');
          const blob = await res.blob();
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `nyaya-interactions-${new Date().toISOString().slice(0, 10)}.jsonl`;
          a.click();
          URL.revokeObjectURL(a.href);
        } catch (err) {
          setError(err.message);
        }
      };

      const sel = 'text-xs rounded-lg border border-zinc-200 bg-white px-2 py-1.5';
      const summary = data?.summary;

      return (
        <section class="space-y-3" aria-label="Interaction log">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h3 class="text-sm font-bold text-zinc-900">📜 Interaction log — every question & answer</h3>
              <p class="text-[11px] text-zinc-500">Signed-in users and guests, including failed requests. Review answers to find what to fix.</p>
            </div>
            <button type="button" onClick={exportJsonl} class="text-xs font-medium px-3 py-1.5 rounded-lg border border-zinc-200 hover:border-zinc-400">⬇ Export (JSONL)</button>
          </div>

          {summary && (
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 text-center">
              {[
                ['Total', summary.total],
                ['Signed in', summary.signedIn],
                ['Guests', summary.guest],
                ['Failures', summary.failures],
                ['To review', summary.unreviewed],
                ['Needs fix', summary.needsFix]
              ].map(([label, n]) => (
                <div key={label} class="rounded-xl bg-zinc-50 border border-zinc-200 py-2">
                  <div class="text-[10px] uppercase tracking-wider text-zinc-500">{label}</div>
                  <div class="text-base font-bold text-zinc-900">{n}</div>
                </div>
              ))}
            </div>
          )}

          <form class="flex flex-wrap items-center gap-2" onSubmit={(e) => { e.preventDefault(); load(0); }}>
            <input value={filters.q} onChange={(e) => setFilters(f => ({ ...f, q: e.target.value }))} placeholder="Search questions, answers, emails, notes…"
              class="flex-1 min-w-[12rem] text-xs rounded-lg border border-zinc-200 px-2.5 py-1.5" />
            <select class={sel} value={filters.authState} onChange={(e) => setFilters(f => ({ ...f, authState: e.target.value }))} aria-label="Signed in or guest">
              <option value="">Everyone</option><option value="signed-in">Signed in</option><option value="guest">Guests</option>
            </select>
            <select class={sel} value={filters.status} onChange={(e) => setFilters(f => ({ ...f, status: e.target.value }))} aria-label="Outcome">
              <option value="">Any outcome</option>
              {Object.keys(LOG_STATUS_STYLE).map(s => <option key={s} value={s}>{s.replace('_', ' ')}</option>)}
            </select>
            <select class={sel} value={filters.reviewStatus} onChange={(e) => setFilters(f => ({ ...f, reviewStatus: e.target.value }))} aria-label="Review status">
              <option value="">Any review</option>
              {Object.entries(LOG_REVIEW_LABEL).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
            </select>
            <select class={sel} value={filters.rating} onChange={(e) => setFilters(f => ({ ...f, rating: e.target.value }))} aria-label="User rating">
              <option value="">Any rating</option><option value="-1">👎 by user</option><option value="1">👍 by user</option><option value="0">Not rated</option>
            </select>
            <select class={sel} value={filters.domain} onChange={(e) => setFilters(f => ({ ...f, domain: e.target.value }))} aria-label="Area of law">
              <option value="">All areas</option>
              {(data?.domains || []).map(d => <option key={d.domain} value={d.domain}>{d.domain} ({d.count})</option>)}
            </select>
            <button type="submit" class="text-xs font-medium px-3 py-1.5 rounded-lg bg-zinc-900 text-white">{loading ? '…' : 'Search'}</button>
          </form>

          {error && <p class="text-xs text-red-700">{error}</p>}

          <div class="divide-y divide-zinc-100 border border-zinc-200 rounded-xl bg-white max-h-[28rem] overflow-y-auto">
            {(data?.entries || []).length === 0 && !loading && <p class="p-4 text-xs text-zinc-500">No interactions match these filters.</p>}
            {(data?.entries || []).map(e => (
              <button key={e.id} type="button" onClick={() => openDetail(e.id)}
                class={`w-full text-left p-3 hover:bg-zinc-50 space-y-1 text-xs ${detail?.id === e.id ? 'bg-amber-50/60' : ''}`}>
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class={`px-2 py-0.5 rounded-full border text-[10px] font-medium ${LOG_STATUS_STYLE[e.status] || ''}`}>{e.status.replace('_', ' ')}</span>
                  <span class={`px-2 py-0.5 rounded-full text-[10px] font-medium ${e.authState === 'signed-in' ? 'bg-sky-50 text-sky-900 border border-sky-200' : 'bg-zinc-100 text-zinc-600 border border-zinc-200'}`}>
                    {e.authState === 'signed-in' ? `🔐 ${e.userEmail || e.userId}` : `👤 Guest ${String(e.userId || '').slice(0, 14)}`}
                  </span>
                  {e.userRole === 'superadmin' && <span class="px-2 py-0.5 rounded-full text-[10px] bg-amber-100 text-amber-900">admin</span>}
                  {e.domain && <span class="px-2 py-0.5 rounded-full text-[10px] bg-amber-50 text-amber-900 border border-amber-200">{e.domain}</span>}
                  {e.intakeKind && <span class="px-2 py-0.5 rounded-full text-[10px] bg-zinc-50 text-zinc-600 border border-zinc-200">{e.intakeKind}{e.intakeStage ? ` · ${e.intakeStage}` : ''}</span>}
                  {e.userRating === -1 && <span class="text-[10px] text-red-700">👎</span>}
                  {e.userRating === 1 && <span class="text-[10px] text-emerald-700">👍</span>}
                  {e.reviewStatus !== 'unreviewed' && <span class="text-[10px] text-zinc-600">{LOG_REVIEW_LABEL[e.reviewStatus]}</span>}
                  <span class="ml-auto text-[10px] text-zinc-400">{formatShareDate(e.createdAt)}</span>
                </div>
                <div class="text-zinc-800 line-clamp-2"><strong>Q{e.isFollowUp ? ' (follow-up)' : ''}:</strong> {e.questionPreview || '(no text)'}</div>
                {e.errorMessage
                  ? <div class="text-red-700 truncate">⚠ {e.errorMessage}</div>
                  : <div class="text-zinc-500 truncate"><strong>A:</strong> {e.answerPreview}</div>}
                <div class="text-[10px] text-zinc-400">{e.modelUsed || '—'} · {e.latencyMs ? `${(e.latencyMs / 1000).toFixed(1)}s` : '—'} · ₹{Number(e.costInr || 0).toFixed(3)}{e.appVersion ? ` · v${e.appVersion}` : ''}</div>
              </button>
            ))}
          </div>

          {data && data.total > PAGE && (
            <div class="flex items-center justify-between text-xs text-zinc-500">
              <span>{offset + 1}–{Math.min(offset + PAGE, data.total)} of {data.total}</span>
              <div class="flex gap-2">
                <button type="button" disabled={offset === 0} onClick={() => load(Math.max(0, offset - PAGE))} class="px-3 py-1 rounded-lg border border-zinc-200 disabled:opacity-40">← Newer</button>
                <button type="button" disabled={offset + PAGE >= data.total} onClick={() => load(offset + PAGE)} class="px-3 py-1 rounded-lg border border-zinc-200 disabled:opacity-40">Older →</button>
              </div>
            </div>
          )}

          {detail && (
            <div class="rounded-xl border border-zinc-200 bg-zinc-50 p-3 sm:p-4 space-y-3 text-xs">
              <div class="flex items-start justify-between gap-2">
                <div class="space-y-0.5">
                  <div class="font-bold text-sm text-zinc-900">{detail.authState === 'signed-in' ? `🔐 ${detail.userEmail || detail.userId}` : `👤 Guest (${detail.userId})`}</div>
                  <div class="text-zinc-500">
                    {formatShareDate(detail.createdAt)} · {detail.endpoint} · HTTP {detail.httpStatus} · session {detail.sessionId || '—'}{detail.turnIndex ? ` · turn ${detail.turnIndex}` : ''}
                  </div>
                </div>
                <button type="button" onClick={() => setDetail(null)} class="text-zinc-400 hover:text-zinc-900">Close ✕</button>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div class="rounded-lg bg-white border border-zinc-200 p-2.5 space-y-0.5">
                  <div class="font-semibold text-zinc-700">How Nyaya routed it</div>
                  <div>Category: {detail.categoryLabel || '—'}</div>
                  <div>Area: {detail.domain || '—'} · Mode: {detail.effectiveMode || '—'} (asked: {detail.requestedMode || '—'})</div>
                  <div>Intake: {detail.intakeKind || '—'} · {detail.intakeStage || '—'}</div>
                </div>
                <div class="rounded-lg bg-white border border-zinc-200 p-2.5 space-y-0.5">
                  <div class="font-semibold text-zinc-700">Performance</div>
                  <div>Model: {detail.modelUsed || '—'} (asked: {detail.requestedModel || '—'})</div>
                  <div>{detail.latencyMs ? `${(detail.latencyMs / 1000).toFixed(1)}s` : '—'} · {detail.tokens} tokens · ₹{Number(detail.costInr || 0).toFixed(3)}</div>
                  <div>Cut off: {detail.completionIncomplete ? 'yes' : 'no'} · Record checks: {detail.verificationPassed === null ? '—' : detail.verificationPassed ? 'passed' : 'flagged'}</div>
                  <div>User rating: {detail.userRating === 1 ? '👍' : detail.userRating === -1 ? '👎' : '—'}{detail.userFeedbackNote ? ` “${detail.userFeedbackNote}”` : ''}</div>
                </div>
              </div>

              {detail.errorMessage && <div class="rounded-lg bg-red-50 border border-red-200 p-2.5 text-red-800 whitespace-pre-wrap">⚠ {detail.errorMessage}</div>}

              <div class="rounded-lg bg-white border border-zinc-200 p-2.5">
                <div class="font-semibold text-zinc-700 mb-1">Request (PII-redacted, as sent to the model)</div>
                <pre class="whitespace-pre-wrap text-[11px] text-zinc-800 max-h-64 overflow-y-auto">{detail.requestText || '(empty)'}</pre>
              </div>

              {detail.clarifyingQuestions?.length > 0 && (
                <div class="rounded-lg bg-white border border-zinc-200 p-2.5">
                  <div class="font-semibold text-zinc-700 mb-1">Follow-up questions shown to the user</div>
                  <ol class="list-decimal pl-4 space-y-0.5">{detail.clarifyingQuestions.map((q, i) => <li key={i}>{q}</li>)}</ol>
                </div>
              )}

              <div class="rounded-lg bg-white border border-zinc-200 p-2.5">
                <div class="font-semibold text-zinc-700 mb-1">Response</div>
                {detail.responseText
                  ? <div class="markdown-body max-h-96 overflow-y-auto" dangerouslySetInnerHTML={renderFormattedMarkdown(detail.responseText)} />
                  : <div class="text-zinc-400">(no response)</div>}
              </div>

              <div class="rounded-lg bg-white border border-amber-200 p-2.5 space-y-2">
                <div class="font-semibold text-amber-900">Your review</div>
                <div class="flex flex-wrap gap-1.5">
                  {Object.entries(LOG_REVIEW_LABEL).map(([k, v]) => (
                    <button key={k} type="button" onClick={() => setReview(r => ({ ...r, reviewStatus: k }))}
                      class={`px-2.5 py-1 rounded-full border text-[11px] ${review.reviewStatus === k ? 'bg-zinc-900 text-white border-zinc-900' : 'border-zinc-200 hover:border-zinc-400'}`}>{v}</button>
                  ))}
                </div>
                <div class="flex flex-wrap gap-1.5">
                  {(data?.reviewTags || []).map(tag => {
                    const on = review.tags.includes(tag);
                    return (
                      <button key={tag} type="button"
                        onClick={() => setReview(r => ({ ...r, tags: on ? r.tags.filter(t => t !== tag) : [...r.tags, tag] }))}
                        class={`px-2 py-0.5 rounded-full border text-[10px] ${on ? 'bg-amber-100 border-amber-300 text-amber-950' : 'border-zinc-200 text-zinc-600'}`}>{tag}</button>
                    );
                  })}
                </div>
                <textarea rows="3" value={review.note} onChange={(e) => setReview(r => ({ ...r, note: e.target.value }))}
                  placeholder="What was wrong and what the right answer or behaviour should be…"
                  class="w-full text-xs rounded-lg border border-zinc-200 px-2.5 py-2" />
                <div class="flex items-center justify-between gap-2">
                  <span class="text-[10px] text-zinc-400">{detail.reviewedAt ? `Last reviewed by ${detail.reviewedBy} · ${formatShareDate(detail.reviewedAt)}` : ''}</span>
                  <button type="button" disabled={saving} onClick={saveReview} class="px-3 py-1.5 rounded-lg bg-zinc-900 text-white font-medium disabled:opacity-50">{saving ? 'Saving…' : 'Save review'}</button>
                </div>
              </div>
            </div>
          )}
        </section>
      );
    }

    const SUGGESTION_DOMAIN_OPTIONS = [
      ['general', 'General / not sure'],
      ['consumer', 'Consumer dispute'],
      ['property-rera', 'Property / builder / RERA'],
      ['tenancy-civil', 'Tenancy / rent / civil'],
      ['matrimonial-family', 'Matrimony / DV / family'],
      ['inheritance-partition', 'Inheritance / partition / will'],
      ['criminal-bns-bnss', 'Criminal (BNS / BNSS / BSA)'],
      ['cheque-bounce-138', 'Cheque bounce (s.138 NI Act)'],
      ['corporate-roc', 'Company / RoC / startup'],
      ['employment-labour', 'Employment / labour / POSH'],
      ['banking-sarfaesi', 'Banking / SARFAESI / DRT'],
      ['motor-accident', 'Motor accident (MACT)'],
      ['tax-rti-writ', 'Tax / RTI / writ'],
      ['msme-arbitration', 'MSME dues / arbitration']
    ];
    const SUGGESTION_STATUS_LABEL = {
      pending: '⏳ Waiting for review',
      'needs-changes': '✏️ Sent back for changes',
      approved: '✅ Approved — Nyaya now follows it',
      rejected: '✖ Not accepted',
      retired: '🗄️ Retired'
    };

    /**
     * Lets anyone (advocates especially) suggest how Nyaya should handle a kind of question.
     * Shows the submitter's earlier suggestions and their review status.
     */
    function SuggestImprovementPanel({ buildAuthHeaders, onClose, prefill = {} }) {
      const [form, setForm] = useState({
        expertise: 'advocate',
        domain: prefill.domain && SUGGESTION_DOMAIN_OPTIONS.some(([d]) => d === prefill.domain) ? prefill.domain : 'general',
        situation: '',
        expectedBehaviour: '',
        exampleQuestion: prefill.exampleQuestion || ''
      });
      const [mine, setMine] = useState([]);
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState('');
      const [editingId, setEditingId] = useState('');

      const loadMine = async () => {
        try {
          const res = await fetch('/api/suggestions/mine', { headers: buildAuthHeaders() });
          const data = await res.json();
          if (res.ok) setMine(data.mine || []);
        } catch {
          // ignore
        }
      };
      useEffect(() => { loadMine(); }, []);

      const submit = async (e) => {
        e.preventDefault();
        setBusy(true);
        setMessage('');
        try {
          const res = await fetch(editingId ? `/api/suggestions/${encodeURIComponent(editingId)}` : '/api/suggestions', {
            method: editingId ? 'PATCH' : 'POST',
            headers: buildAuthHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ ...form, sessionId: prefill.sessionId || '', turnId: prefill.turnId || null })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Could not send your suggestion');
          setMine(data.mine || []);
          setForm(f => ({ ...f, situation: '', expectedBehaviour: '', exampleQuestion: '' }));
          setEditingId('');
          setMessage('✓ Thank you — an expert will review it. Once approved, Nyaya will follow it for similar questions.');
        } catch (err) {
          setMessage(err.message);
        } finally {
          setBusy(false);
        }
      };

      const startEdit = (s) => {
        setEditingId(s.id);
        setForm({ expertise: s.submitterExpertise, domain: s.domain, situation: s.situation, expectedBehaviour: s.expectedBehaviour, exampleQuestion: s.exampleQuestion });
        setMessage('');
      };

      const field = 'w-full text-sm px-3 py-2 rounded-xl border border-zinc-200 bg-zinc-50 focus:outline-none focus:border-zinc-400';

      return (
        <div class="rounded-2xl border border-zinc-200 bg-white p-4 space-y-3 text-sm shadow-sm">
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="font-semibold text-zinc-900">💡 Suggest how Nyaya should respond</div>
              <div class="text-xs text-zinc-500">Tell us how a good lawyer would handle this kind of question. An expert reviews every suggestion before Nyaya starts following it.</div>
            </div>
            <button type="button" onClick={onClose} aria-label="Close suggestion" class="w-8 h-8 rounded-full text-zinc-400 hover:text-zinc-800 hover:bg-zinc-100 shrink-0">✕</button>
          </div>

          <form onSubmit={submit} class="space-y-2.5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <label class="text-xs text-zinc-600 space-y-1">
                <span>I am a</span>
                <select value={form.expertise} onChange={(e) => setForm(f => ({ ...f, expertise: e.target.value }))} class={field}>
                  <option value="advocate">Practising advocate</option>
                  <option value="legal-professional">Legal professional</option>
                  <option value="law-student">Law student</option>
                  <option value="user">User</option>
                </select>
              </label>
              <label class="text-xs text-zinc-600 space-y-1">
                <span>Area of law</span>
                <select value={form.domain} onChange={(e) => setForm(f => ({ ...f, domain: e.target.value }))} class={field}>
                  {SUGGESTION_DOMAIN_OPTIONS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                </select>
              </label>
            </div>
            <label class="block text-xs text-zinc-600 space-y-1">
              <span>When someone asks about… <span class="text-zinc-400">(the kind of question or situation)</span></span>
              <input value={form.situation} onChange={(e) => setForm(f => ({ ...f, situation: e.target.value }))} required minLength={10} maxLength={600}
                placeholder="e.g. A wife accused under s.69 BNS where the relationship started as a promise to marry" class={field} />
            </label>
            <label class="block text-xs text-zinc-600 space-y-1">
              <span>Nyaya should… <span class="text-zinc-400">(what to ask, which law/case to apply, what to avoid)</span></span>
              <textarea value={form.expectedBehaviour} onChange={(e) => setForm(f => ({ ...f, expectedBehaviour: e.target.value }))} required minLength={20} maxLength={4000} rows="4"
                placeholder="e.g. First ask whether consent was given on a false promise from the start; cite Pramod Suryabhan Pawar (2019) 9 SCC 608; never call a consensual relationship that later broke down an offence by itself…" class={field} />
            </label>
            <label class="block text-xs text-zinc-600 space-y-1">
              <span>Example question <span class="text-zinc-400">(optional)</span></span>
              <textarea value={form.exampleQuestion} onChange={(e) => setForm(f => ({ ...f, exampleQuestion: e.target.value }))} maxLength={2000} rows="2" class={field} />
            </label>
            <p class="text-[11px] text-zinc-400">Please don't include names, phone numbers or other personal details.</p>
            <div class="flex items-center gap-2">
              <button type="submit" disabled={busy} class="h-10 px-5 rounded-full bg-zinc-900 text-white text-sm font-semibold hover:bg-zinc-800 disabled:opacity-50">
                {busy ? 'Sending…' : editingId ? 'Resubmit for review' : 'Send suggestion'}
              </button>
              {editingId && <button type="button" onClick={() => { setEditingId(''); setForm(f => ({ ...f, situation: '', expectedBehaviour: '', exampleQuestion: '' })); }} class="text-xs text-zinc-500">Cancel edit</button>}
            </div>
          </form>

          {message && <p class="text-xs text-zinc-700">{message}</p>}

          {mine.length > 0 && (
            <details class="text-xs" open>
              <summary class="cursor-pointer font-medium text-zinc-500">Your suggestions ({mine.length})</summary>
              <ul class="mt-2 space-y-2">
                {mine.map(s => (
                  <li key={s.id} class="rounded-xl border border-zinc-200 p-2.5 space-y-1">
                    <div class="flex flex-wrap items-center justify-between gap-1">
                      <span class="font-medium text-zinc-800">{s.situation}</span>
                      <span class="text-[11px] text-zinc-600">{SUGGESTION_STATUS_LABEL[s.status] || s.status}</span>
                    </div>
                    {s.reviewerNote && <div class="text-[11px] text-zinc-600 bg-zinc-50 rounded-lg px-2 py-1">Reviewer: {s.reviewerNote}</div>}
                    {['pending', 'needs-changes'].includes(s.status) && (
                      <button type="button" onClick={() => startEdit(s)} class="text-[11px] font-medium text-zinc-700 underline">Edit</button>
                    )}
                  </li>
                ))}
              </ul>
            </details>
          )}
        </div>
      );
    }

    /**
     * Review queue for experts and the Super-Admin. Approving teaches Nyaya the (edited) rule immediately.
     */
    function SuggestionReviewPanel({ buildAuthHeaders, onClose }) {
      const [statusFilter, setStatusFilter] = useState('pending');
      const [data, setData] = useState({ suggestions: [], counts: {} });
      const [drafts, setDrafts] = useState({});
      const [busyId, setBusyId] = useState('');
      const [error, setError] = useState('');

      const load = async (status = statusFilter) => {
        setError('');
        try {
          const res = await fetch(`/api/review/suggestions?status=${encodeURIComponent(status)}`, { headers: buildAuthHeaders() });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Could not load suggestions');
          setData(json);
        } catch (err) {
          setError(err.message);
        }
      };
      useEffect(() => { load(statusFilter); }, [statusFilter]);

      const draftFor = (s) => drafts[s.id] || {
        domain: s.domain,
        lessonTopic: s.lessonTopic || s.situation,
        lessonText: s.lessonText || s.expectedBehaviour,
        note: s.reviewerNote || ''
      };
      const setDraft = (s, patch) => setDrafts(d => ({ ...d, [s.id]: { ...draftFor(s), ...patch } }));

      const act = async (s, action) => {
        const d = draftFor(s);
        if (['reject', 'needs-changes'].includes(action) && !d.note.trim()) {
          setError('Add a short note so the person knows why.');
          return;
        }
        setBusyId(s.id);
        setError('');
        try {
          const res = await fetch(`/api/review/suggestions/${encodeURIComponent(s.id)}`, {
            method: 'PATCH',
            headers: buildAuthHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ action, ...d, listStatus: statusFilter })
          });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Could not save the decision');
          setData({ suggestions: json.suggestions, counts: json.counts });
        } catch (err) {
          setError(err.message);
        } finally {
          setBusyId('');
        }
      };

      const field = 'w-full text-xs px-2.5 py-2 rounded-lg border border-zinc-200 bg-white focus:outline-none focus:border-zinc-400';

      return (
        <section class="rounded-2xl border-2 border-emerald-200 bg-white p-4 space-y-3 text-sm shadow-sm" aria-label="Review improvement suggestions">
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="font-semibold text-zinc-900">🧑‍⚖️ Review improvement suggestions</div>
              <div class="text-xs text-zinc-500">Approve to teach Nyaya the rule (it is used for similar questions right away). Edit the wording first if needed.</div>
            </div>
            <button type="button" onClick={onClose} aria-label="Close review" class="w-8 h-8 rounded-full text-zinc-400 hover:text-zinc-800 hover:bg-zinc-100 shrink-0">✕</button>
          </div>

          <div class="flex flex-wrap gap-1.5 text-xs">
            {['pending', 'needs-changes', 'approved', 'rejected', 'retired'].map(st => (
              <button key={st} type="button" onClick={() => setStatusFilter(st)}
                class={`px-3 py-1.5 rounded-full border ${statusFilter === st ? 'bg-zinc-900 text-white border-zinc-900' : 'border-zinc-200 hover:border-zinc-400'}`}>
                {SUGGESTION_STATUS_LABEL[st].replace(/ — .*/, '')} ({data.counts?.[st] || 0})
              </button>
            ))}
          </div>

          {error && <p class="text-xs text-red-700">{error}</p>}
          {data.suggestions.length === 0 && <p class="text-xs text-zinc-500 py-4 text-center">Nothing here.</p>}

          <div class="space-y-3">
            {data.suggestions.map(s => {
              const d = draftFor(s);
              const editable = ['pending', 'needs-changes'].includes(s.status);
              return (
                <article key={s.id} class="rounded-xl border border-zinc-200 p-3 space-y-2 text-xs">
                  <div class="flex flex-wrap items-center gap-1.5">
                    <span class="px-2 py-0.5 rounded-full bg-zinc-100 text-zinc-700">{s.submitterExpertise}</span>
                    <span class={`px-2 py-0.5 rounded-full ${s.submitterAuth === 'signed-in' ? 'bg-sky-50 text-sky-900 border border-sky-200' : 'bg-zinc-100 text-zinc-600'}`}>
                      {s.submitterAuth === 'signed-in' ? `🔐 ${s.submitterEmail || s.submitterName}` : '👤 Guest'}
                    </span>
                    <span class="px-2 py-0.5 rounded-full bg-amber-50 text-amber-900 border border-amber-200">{s.domain}</span>
                    {s.linkedSessionId && <span class="text-zinc-400">from conversation {s.linkedSessionId}</span>}
                    <span class="ml-auto text-zinc-400">{formatShareDate(s.createdAt)}</span>
                  </div>
                  <div><strong>When:</strong> {s.situation}</div>
                  <div class="whitespace-pre-wrap"><strong>Nyaya should:</strong> {s.expectedBehaviour}</div>
                  {s.exampleQuestion && <div class="whitespace-pre-wrap text-zinc-600"><strong>Example:</strong> {s.exampleQuestion}</div>}

                  {editable ? (
                    <div class="rounded-lg bg-emerald-50/50 border border-emerald-200 p-2.5 space-y-2">
                      <div class="font-semibold text-emerald-900">Rule Nyaya will learn (edit before approving)</div>
                      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <select value={d.domain} onChange={(e) => setDraft(s, { domain: e.target.value })} class={field} aria-label="Area of law">
                          {SUGGESTION_DOMAIN_OPTIONS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                        </select>
                        <input value={d.lessonTopic} onChange={(e) => setDraft(s, { lessonTopic: e.target.value })} class={`${field} sm:col-span-2`} aria-label="Topic" placeholder="Topic" />
                      </div>
                      <textarea rows="4" value={d.lessonText} onChange={(e) => setDraft(s, { lessonText: e.target.value })} class={field} aria-label="Lesson text" />
                      <input value={d.note} onChange={(e) => setDraft(s, { note: e.target.value })} class={field} placeholder="Note to the person who suggested it (required to send back or decline)" />
                      <div class="flex flex-wrap gap-2">
                        <button type="button" disabled={busyId === s.id} onClick={() => act(s, 'approve')} class="px-3 py-1.5 rounded-full bg-emerald-700 text-white font-medium hover:bg-emerald-800 disabled:opacity-50">✅ Approve & teach Nyaya</button>
                        <button type="button" disabled={busyId === s.id} onClick={() => act(s, 'needs-changes')} class="px-3 py-1.5 rounded-full border border-amber-300 text-amber-900 hover:bg-amber-50 disabled:opacity-50">✏️ Send back</button>
                        <button type="button" disabled={busyId === s.id} onClick={() => act(s, 'reject')} class="px-3 py-1.5 rounded-full border border-red-200 text-red-700 hover:bg-red-50 disabled:opacity-50">✖ Decline</button>
                      </div>
                    </div>
                  ) : (
                    <div class="rounded-lg bg-zinc-50 border border-zinc-200 p-2.5 space-y-1">
                      <div>{SUGGESTION_STATUS_LABEL[s.status]}{s.reviewerName ? ` · by ${s.reviewerName}` : ''}{s.reviewedAt ? ` · ${formatShareDate(s.reviewedAt)}` : ''}</div>
                      {s.lessonText && <div class="whitespace-pre-wrap text-zinc-700"><strong>Lesson:</strong> {s.lessonText}</div>}
                      {s.reviewerNote && <div class="text-zinc-600">Note: {s.reviewerNote}</div>}
                      {s.status === 'approved' && (
                        <button type="button" disabled={busyId === s.id} onClick={() => act(s, 'retire')} class="px-3 py-1 rounded-full border border-zinc-300 text-zinc-700 hover:bg-white disabled:opacity-50">🗄️ Retire (stop using it)</button>
                      )}
                    </div>
                  )}
                </article>
              );
            })}
          </div>
        </section>
      );
    }

    /**
     * Inline audit box for one saved answer. Creates the log entry on first use (older answers predate the log).
     */
    function TurnAuditBox({ turnId, initialAudit, buildAuthHeaders }) {
      const [entry, setEntry] = useState(null);
      const [tags, setTags] = useState([]);
      const [form, setForm] = useState({ reviewStatus: 'unreviewed', tags: [], note: '' });
      const [open, setOpen] = useState(false);
      const [saving, setSaving] = useState(false);
      const [status, setStatus] = useState(initialAudit?.reviewStatus || '');
      const [err, setErr] = useState('');

      const openAudit = async () => {
        setOpen(true);
        if (entry) return;
        try {
          const res = await fetch(`/api/admin/turns/${turnId}/audit`, { method: 'POST', headers: buildAuthHeaders() });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Could not open the audit');
          setEntry(json.entry);
          setTags(json.reviewTags || []);
          setForm({ reviewStatus: json.entry.reviewStatus, tags: json.entry.reviewTags || [], note: json.entry.reviewNote || '' });
        } catch (e) {
          setErr(e.message);
        }
      };

      const save = async () => {
        if (!entry) return;
        setSaving(true);
        setErr('');
        try {
          const res = await fetch(`/api/admin/logs/${encodeURIComponent(entry.id)}`, {
            method: 'PATCH',
            headers: buildAuthHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify(form)
          });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Could not save the audit');
          setEntry(json.entry);
          setStatus(json.entry.reviewStatus);
          setOpen(false);
        } catch (e) {
          setErr(e.message);
        } finally {
          setSaving(false);
        }
      };

      if (!open) {
        return (
          <div class="flex items-center gap-2 text-[11px]">
            <button type="button" onClick={openAudit} class="px-2.5 py-1 rounded-full border border-amber-300 text-amber-900 hover:bg-amber-50">📝 Audit this answer</button>
            {status && status !== 'unreviewed' && <span class="text-zinc-600">{LOG_REVIEW_LABEL[status]}</span>}
          </div>
        );
      }
      return (
        <div class="rounded-lg bg-amber-50/60 border border-amber-200 p-2.5 space-y-2 text-xs">
          {!entry && !err && <div class="text-zinc-500">Opening…</div>}
          {err && <div class="text-red-700">{err}</div>}
          {entry && (
            <>
              <div class="flex flex-wrap gap-1.5">
                {Object.entries(LOG_REVIEW_LABEL).map(([k, v]) => (
                  <button key={k} type="button" onClick={() => setForm(f => ({ ...f, reviewStatus: k }))}
                    class={`px-2.5 py-1 rounded-full border text-[11px] ${form.reviewStatus === k ? 'bg-zinc-900 text-white border-zinc-900' : 'border-zinc-200 bg-white hover:border-zinc-400'}`}>{v}</button>
                ))}
              </div>
              <div class="flex flex-wrap gap-1.5">
                {tags.map(tag => {
                  const on = form.tags.includes(tag);
                  return (
                    <button key={tag} type="button" onClick={() => setForm(f => ({ ...f, tags: on ? f.tags.filter(t => t !== tag) : [...f.tags, tag] }))}
                      class={`px-2 py-0.5 rounded-full border text-[10px] ${on ? 'bg-amber-100 border-amber-300 text-amber-950' : 'border-zinc-200 bg-white text-zinc-600'}`}>{tag}</button>
                  );
                })}
              </div>
              <textarea rows="3" value={form.note} onChange={(e) => setForm(f => ({ ...f, note: e.target.value }))}
                placeholder="What was wrong, and what the right answer or behaviour should be…"
                class="w-full text-xs rounded-lg border border-zinc-200 px-2.5 py-2 bg-white" />
              <div class="flex items-center justify-end gap-2">
                <button type="button" onClick={() => setOpen(false)} class="text-zinc-500">Cancel</button>
                <button type="button" disabled={saving} onClick={save} class="px-3 py-1.5 rounded-lg bg-zinc-900 text-white font-medium disabled:opacity-50">{saving ? 'Saving…' : 'Save audit'}</button>
              </div>
            </>
          )}
        </div>
      );
    }

    /**
     * Super-Admin: every user's cases (signed-in and guest), with a read-only viewer and per-answer audit.
     */

      const [q, setQ] = useState('');
      const [list, setList] = useState({ sessions: [], total: 0 });
      const [offset, setOffset] = useState(0);
      const [loading, setLoading] = useState(false);

      const [err, setErr] = useState('');
      const PAGE = 30;

      const load = async (nextOffset = 0) => {
        setLoading(true);
        setErr('');
        try {
          const p = new URLSearchParams({ limit: String(PAGE), offset: String(nextOffset) });
          if (q.trim()) p.set('q', q.trim());
          const res = await fetch(`/api/admin/cases?${p}`, { headers: buildAuthHeaders() });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Could not load cases');
          setList(json);
          setOffset(nextOffset);
        } catch (e) {
          setErr(e.message);
        } finally {
          setLoading(false);
        }
      };
      useEffect(() => { load(0); }, []);

      const openCase = async (id) => {
        setErr('');
        try {
          const res = await fetch(`/api/admin/sessions/${encodeURIComponent(id)}`, { headers: buildAuthHeaders() });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Could not open the case');
          setViewing(json.session);
        } catch (e) {
          setErr(e.message);
        }

      if (viewing) {

            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <button type="button" onClick={() => setViewing(null)} class="text-xs text-zinc-500 hover:text-zinc-900">← All cases</button>
                <h4 class="text-sm font-semibold text-zinc-900 mt-1">{viewing.title}</h4>
                <div class="text-[11px] text-zinc-500">

              </div>
            </div>
            <div class="space-y-3 max-h-[32rem] overflow-y-auto pr-1">
              {(viewing.turns || []).map(t => (
                <div key={t.id} class="rounded-xl border border-zinc-200 p-3 space-y-2">
                  <div class="flex flex-wrap items-center justify-between gap-2 text-[11px] text-zinc-500">
                    <span>Question {t.turnIndex} · {formatShareDate(t.createdAt)} · {t.model}</span>
                    <span>{t.userRating === 1 ? '👍 user found it helpful' : t.userRating === -1 ? `👎 user: ${t.userFeedbackNote || 'not helpful'}` : ''}</span>
                  </div>
                  <div class="bg-zinc-900 text-white rounded-xl px-3 py-2 text-xs whitespace-pre-wrap">
                    {String(t.userInput || '').split('ATTACHED FOLDER / TEXT DOCUMENTS:')[0].trim() || '(documents only)'}
                  </div>
                  <details class="text-xs" open={(viewing.turns || []).length <= 2}>
                    <summary class="cursor-pointer text-zinc-600 font-medium">Nyaya's answer</summary>
                    <div class="markdown-body mt-2" dangerouslySetInnerHTML={renderFormattedMarkdown(t.assistantMarkdown)} />
                  </details>
                  <div class="flex flex-wrap items-start gap-2">
                    <div class="flex-1 min-w-[14rem]"><TurnAuditBox turnId={t.id} initialAudit={t.audit} buildAuthHeaders={buildAuthHeaders} /></div>
                    <button
                      type="button"
                      onClick={() => onSuggestRule({
                        sessionId: viewing.id,
                        turnId: t.id,
                        domain: t.engineResult?.domainInfo?.domain || 'general',
                        exampleQuestion: String(t.userInput || '').split('ATTACHED FOLDER / TEXT DOCUMENTS:')[0].trim().slice(0, 600)
                      })}
                      class="px-2.5 py-1 rounded-full border border-emerald-300 text-emerald-900 text-[11px] hover:bg-emerald-50"
                    >
                      💡 Turn into a rule
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      return (
        <div class="space-y-3">
          <form class="flex gap-2" onSubmit={(e) => { e.preventDefault(); load(0); }}>
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search by case name, question text, email or user id…"
              class="flex-1 text-xs rounded-lg border border-zinc-200 px-3 py-2" />
            <button type="submit" class="text-xs font-medium px-3 py-2 rounded-lg bg-zinc-900 text-white">{loading ? '…' : 'Search'}</button>
          </form>
          {err && <p class="text-xs text-red-700">{err}</p>}
          <div class="text-[11px] text-zinc-500">{list.total} case(s) from all users</div>
          <div class="divide-y divide-zinc-100 max-h-96 overflow-y-auto border border-zinc-200/80 rounded-xl">
            {list.sessions.length === 0 && !loading && <div class="text-xs text-zinc-400 py-6 text-center">No cases match.</div>}
            {list.sessions.map(s => (
              <button key={s.id} type="button" onClick={() => openCase(s.id)} class="w-full text-left p-3 hover:bg-zinc-50 space-y-1">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="text-xs font-semibold text-zinc-900">{s.title}</span>
                  <span class="text-[10px] px-2 py-0.5 rounded-full bg-zinc-100 text-zinc-600">{s.turnCount} {s.turnCount === 1 ? 'turn' : 'turns'}</span>
                  {s.hasThumbsDown && <span class="text-[10px] text-red-700">👎</span>}
                </div>
                <div class="text-[11px] text-zinc-500">
                  {s.signedIn ? `🔐 ${s.userEmail}` : `👤 Guest ${String(s.userId).slice(0, 16)}`}{s.userRole === 'superadmin' ? ' · admin' : ''} · updated {formatShareDate(s.updatedAt)} · View →
                </div>
              </button>
            ))}
          </div>
          {list.total > PAGE && (
            <div class="flex items-center justify-between text-xs text-zinc-500">
              <span>{offset + 1}–{Math.min(offset + PAGE, list.total)} of {list.total}</span>
              <div class="flex gap-2">
                <button type="button" disabled={offset === 0} onClick={() => load(Math.max(0, offset - PAGE))} class="px-3 py-1 rounded-lg border border-zinc-200 disabled:opacity-40">← Newer</button>
                <button type="button" disabled={offset + PAGE >= list.total} onClick={() => load(offset + PAGE)} class="px-3 py-1 rounded-lg border border-zinc-200 disabled:opacity-40">Older →</button>
              </div>
            </div>
          )}
        </div>
      );
    }

      const [hwFingerprint] = useState(() => {
        try {
          let gpu = '';
          const canvas = document.createElement('canvas');
          const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
          if (gl) {
            const dbg = gl.getExtension('WEBGL_debug_renderer_info');
            if (dbg) {
              gpu = `${gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)}|${gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)}`;
            }
          }
          const raw = [
            gpu,
            `${window.screen?.width || 0}x${window.screen?.height || 0}x${window.screen?.colorDepth || 0}`,
            String(window.devicePixelRatio || 1),
            String(navigator.hardwareConcurrency || 0),
            String(navigator.deviceMemory || 0),
            String(navigator.platform || ''),
            String(Intl.DateTimeFormat().resolvedOptions().timeZone || ''),
            String(navigator.language || '')
          ].join('::');
          let h1 = 0xdeadbeef ^ raw.length;
          let h2 = 0x41c6ce57 ^ raw.length;
          for (let i = 0; i < raw.length; i++) {
            const ch = raw.charCodeAt(i);
            h1 = Math.imul(h1 ^ ch, 2654435761);
            h2 = Math.imul(h2 ^ ch, 1597334677);
          }
          h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
          h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
          return `hw_${(h2 >>> 0).toString(16).padStart(8, '0')}${(h1 >>> 0).toString(16).padStart(8, '0')}`;
        } catch {
          return 'hw_fallback';
        }
