        if (!inferred) return;
        if (inferred.forum) setForum(inferred.forum);
        if (inferred.stage) setStage(inferred.stage);
        if (inferred.serviceDate) setServiceDate(inferred.serviceDate);
        if (inferred.nextHearingDate) setNextHearingDate(inferred.nextHearingDate);
        if (typeof inferred.writtenVersionFiled === 'boolean') setWrittenVersionFiled(inferred.writtenVersionFiled);
        if (inferred.writtenVersionFiledDate) setWrittenVersionFiledDate(inferred.writtenVersionFiledDate);
        if (typeof inferred.complainantEvidenceFiled === 'boolean') setComplainantEvidenceFiled(inferred.complainantEvidenceFiled);
        if (typeof inferred.opEvidenceFiled === 'boolean') setOpEvidenceFiled(inferred.opEvidenceFiled);
        if (inferred.opEvidenceAdjournmentsGranted !== undefined) setOpAdjournments(inferred.opEvidenceAdjournmentsGranted);
        if (inferred.multiOpSummary) setMultiOpSummary(inferred.multiOpSummary);
      };

      const inferAndApplyFromClientCorpus = (allFileNames, textDocs) => {
        const corpus = allFileNames.join('\n') + '\n' + textDocs.map(d => d.content).join('\n');
        const nextState = {};
        const reasons = [];

        const isCivilRecord = /\b(o\.?\s*s\.?\s*no\.?|principal\s+senior\s+civil\s+judge|partition\s+suit|order\s+39\s+rules?\s+1|order\s+14\s+cpc)\b/i.test(corpus);
        if (isCivilRecord) {
          nextState.forum = 'civil-court';
        }

        const wvMatch = corpus.match(/([^\r\n]*?(?:files\s+vakalath\s+(?:and|along\s+with)\s+W\.?V\.?|files\s+Written\s+(?:Version|Statement)|Order\s+Sheet\s*-\s*OP\d*\s+files\s+vakalath\s+and\s+WV|OP\d*-WRITTEN-VERSION-verbatim|vakalath\s+along\s+with\s+W\.V\.\s+of\s+OP)[^\r\n]*)/i);
        if (wvMatch) {
          nextState.writtenVersionFiled = true;
          const dateInLine = wvMatch[1].match(/(\d{2}[./-]\d{2}[./-]\d{4}|\d{4}-\d{2}-\d{2})/)?.[1];
          reasons.push(`Formal reply / Written Version filed${dateInLine ? ` (${dateInLine})` : ''}`);
        }
        if (/Order\s+Sheet\s*-\s*Rejoinder,\s*evidence,\s*Ex\.P\.1|files\s+affidavit\s+evidence\s+along\s+with\s+certificate|Complainant\s+submits\s+that\s+the\s+evidence\s+from\s+his\s+side\s+closed|AFFIDAVIT\s+OF\s+EVIDENCE\s*-\s*notarised\s+copy/i.test(corpus)) {
          nextState.complainantEvidenceFiled = true;
          reasons.push('Complainant Evidence & Rejoinder filed & closed on record');
        }
        if (nextState.complainantEvidenceFiled && /prays\s+time\s+to\s+lead\s+evidence|For\s+affidavit\s+evidence\s+of\s+opposite\s+party|OP\d*\s+evidence\s+finally/i.test(corpus)) {
          nextState.stage = 'op-evidence';
          nextState.opEvidenceFiled = false;
          reasons.push('Stage: OP Evidence');
        }
        const srv = corpus.match(/Notice\s+to\s+(?:OP\.?No\.?\d+|Defendant\s*No\.?\s*\d+|Opposite\s+Party)\s+was\s+served\s+on\s+(\d{2})[./-](\d{2})[./-](\d{4})/i);
        if (srv) {
          nextState.serviceDate = `${srv[3]}-${srv[2].padStart(2, '0')}-${srv[1].padStart(2, '0')}`;
          reasons.push(`Notice Served: ${nextState.serviceDate}`);
        }
        const callMatches = [...corpus.matchAll(/call\s+on\s+(\d{2})[./-](\d{2})[./-](\d{4})/gi)];
        if (callMatches.length > 0) {
          const sortedDates = callMatches.map(m => `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`).sort();
          nextState.nextHearingDate = sortedDates[sortedDates.length - 1];
          reasons.push(`Next Hearing: ${nextState.nextHearingDate}`);
        }
        if (/finally\s+\d{2}[./-]\d{2}[./-]\d{4}/i.test(corpus) && /prays\s+time\s+to\s+lead\s+evidence/i.test(corpus)) {
          nextState.opEvidenceAdjournmentsGranted = 2;
        }
        applyInferredStateToForm(nextState);
        return reasons;
      };

      function rankClientTextDocs(docs) {
        function score(name) {
          const lower = name.toLowerCase();
          if (lower.includes('10-court-record')) return 100;
          if (lower.includes('hearing-prep-2026-11')) return 95;
          if (lower.includes('03-timeline')) return 90;
          if (lower.includes('order-sheets') || lower.includes('daily order')) return 85;
          if (lower.includes('07-open-questions') || lower.includes('06-log')) return 80;
          if (lower.includes('01-first-principles') || lower.includes('02-cast')) return 75;
          if (lower.includes('case-llm-wiki') || lower.includes('readme')) return 70;
          if (lower.includes('-draft')) return 20;
          return 50;
        }
        return [...docs].sort((a, b) => score(b.name) - score(a.name));
      }

      /**
       * Non-Blocking Chunked File / Folder Ingestion:
       * Processes files in small async batches with `setTimeout(0)` yields, resizes images to lightweight thumbnails,
       * captures the FULL file-tree manifest (including PDFs/DOCX order sheets), prioritizes court records over drafts,
       * and auto-checks the UI checkboxes/dates from the folder record!
       */
      const ingestFileBatchNonBlocking = async (fileList) => {
        const files = Array.from(fileList || []).filter(f => !f.name.startsWith('.') && !f.name.startsWith('~$'));
        if (!files.length) return;

        const MAX_IMAGES = 12;
        const MAX_TEXT_DOCS = 35;
        const newImages = [];
        const rawTextDocs = [];
        const allManifestNames = files.map(f => f.webkitRelativePath || f.name);

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const label = file.webkitRelativePath || file.name || `file-${i + 1}`;
          setIngestProgress({
            current: i + 1,
            total: files.length,
            currentFile: label
          });

          await new Promise(r => setTimeout(r, 8));

          if (file.type.startsWith('image/') || /\.(png|jpe?g|webp|gif)$/i.test(file.name)) {
            if (attachedImages.length + newImages.length < MAX_IMAGES) {
              const compressedDataUrl = await compressAndResizeImageFile(file, 1100);
              if (compressedDataUrl) {
                newImages.push({ name: label, size: file.size, dataUrl: compressedDataUrl });
              }
            }
          } else if (/\.(pdf|docx|zip|mp3|wav|m4a|ogg|opus|webm|aac|flac|mp4|mpeg|mpga)$/i.test(file.name) || file.type.startsWith('audio/')) {
            // Send PDF / DOCX / WhatsApp ZIP / Voice Recording (.mp3, .wav, .m4a, .ogg, .opus) to backend extractor (/api/extract-file)
            if (file.size <= 15 * 1024 * 1024) {
              try {
                const base64 = await readFileAsBase64Async(file);
                const extRes = await fetch('/api/extract-file', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ name: label, base64 })
                });
                if (extRes.ok) {
                  const extData = await extRes.json();
                  if (Array.isArray(extData.docs) && extData.docs.length) {
                    rawTextDocs.push(...extData.docs);
                  }
                  if (extData.transcript) {
                    const activeSetter = !door
                      ? setUnifiedNotes
                      : door === 'start'
                      ? setStoryText
                      : door === 'midcase'
                      ? setMidcaseNotes
                      : door === 'company'
                      ? setCompanyNotes
                      : door === 'civil-criminal'
                      ? setCivilCriminalNotes
                      : setLawyerNotes;
                    activeSetter(prev => (prev ? `${prev}\n\n[Voice Recording — ${label}]: ${extData.transcript}` : extData.transcript));
                  }
                }
              } catch {
                // ignore single file extraction error
              }
            }
          } else if (/\.(txt|md|csv|json|log|eml|html?)$/i.test(file.name) || file.type.startsWith('text/')) {
            const content = await readTextFileAsync(file);
            if (content.trim()) {
              rawTextDocs.push({ name: label, size: file.size, content });
            }
          }
        }

        // Prioritize 10-court-record, 03-timeline, and hearing-prep BEFORE -draft files
        const rankedDocs = rankClientTextDocs(rawTextDocs).slice(0, MAX_TEXT_DOCS);

        // Prepend a synthetic File-Tree Manifest doc so PDF/DOCX order-sheet filenames are always visible to the AI!
        const manifestDoc = {
          name: `Folder File-Tree Manifest (${allManifestNames.length} files incl. PDFs/DOCX)`,
          size: allManifestNames.join('\n').length,
          content: `COMPLETE FOLDER FILE LIST (${allManifestNames.length} files):\n` + allManifestNames.map(n => `- ${n}`).join('\n')
        };

        const finalDocs = [manifestDoc, ...rankedDocs];

        if (newImages.length) {
          setAttachedImages(prev => [...prev, ...newImages]);
        }
        setAttachedTextDocs(prev => [...prev, ...finalDocs]);

        const autoSyncedReasons = inferAndApplyFromClientCorpus(allManifestNames, rankedDocs);
        if (allManifestNames.length > 1) {
          setFolderScanSummary({
            folderPath: files[0]?.webkitRelativePath?.split('/')[0] || 'Uploaded Folder',
            textFilesCount: rankedDocs.length,
            imagesCount: newImages.length,
            totalFilesInFolder: allManifestNames.length,
            autoSyncedReasons
          });
        }
        setIngestProgress(null);
      };

      const handleFileUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        await ingestFileBatchNonBlocking(files);
      };

      const handleDrop = async (e) => {
        e.preventDefault();
        const files = Array.from(e.dataTransfer?.files || []);
        await ingestFileBatchNonBlocking(files);
      };

      const handleScanFolderPath = async () => {
        if (!folderPathInput.trim()) return;
        setScanningFolder(true);
        setError(null);
        try {
          const res = await fetch('/api/scan-folder', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ folderPath: folderPathInput.trim() })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Could not scan folder');

          // Keep scanned folder text in `attachedTextDocs` instead of stuffing the textarea!
          if (data.combinedText) {
            setAttachedTextDocs(prev => [
              ...prev,
              {
                name: `Folder: ${data.folderPath} (${data.textFilesCount} files)`,
                size: data.combinedText.length,
                content: data.combinedText
              }
            ]);
          }
          if (data.images?.length) {
            setAttachedImages(prev => [...prev, ...data.images]);
          }
          if (data.inferredCaseState) {
            applyInferredStateToForm(data.inferredCaseState);
          }
          setFolderScanSummary({
            folderPath: data.folderPath,
            totalFilesInFolder: data.totalFilesInFolder || data.fileNames?.length || 0,
            textFilesCount: data.textFilesCount,
            imagesCount: data.imagesCount,
            autoSyncedReasons: data.inferredReasons || [],
            fileNames: data.fileNames || []
          });
        } catch (err) {
          setError(err.message);
        } finally {
          setScanningFolder(false);
        }
      };

      const handlePasteEvent = async (e) => {
        const items = Array.from(e.clipboardData?.items || []);
        const imageFiles = [];
        for (const item of items) {
          if (item.type.startsWith('image/')) {
            const file = item.getAsFile();
            if (file) imageFiles.push(file);
          }
        }
        if (imageFiles.length) {
          e.preventDefault();
          await ingestFileBatchNonBlocking(imageFiles);
          return;
        }
        const pastedText = (e.clipboardData?.getData('text') || '').trim().replace(/^["']|["']$/g, '');
        if (/^[a-zA-Z]:\\[^\n\r]+$/.test(pastedText)) {
          setFolderPathInput(pastedText);
        }
      };

      const handleClipboardButtonClick = async (textSetter) => {
        try {
          if (navigator.clipboard?.read) {
            const items = await navigator.clipboard.read();
            for (const item of items) {
              const imageType = item.types.find(t => t.startsWith('image/'));
              if (imageType) {
                const blob = await item.getType(imageType);
                await ingestFileBatchNonBlocking([new File([blob], 'pasted-screenshot.png', { type: imageType })]);
                return;
              }
            }
          }
          if (navigator.clipboard?.readText) {
            const clipText = await navigator.clipboard.readText();
            if (clipText) {
              const trimmed = clipText.trim().replace(/^["']|["']$/g, '');
              if (/^[a-zA-Z]:\\[^\n\r]+$/.test(trimmed)) {
                setFolderPathInput(trimmed);
              }
              textSetter(prev => (prev ? prev + '\n' + clipText : clipText));
              return;
            }
          }
        } catch {
          const entered = window.prompt('Paste your text or folder path (e.g. C:\\Users\\...\\my-case-folder) here:');
          if (entered) {
            const trimmed = entered.trim().replace(/^["']|["']$/g, '');
            if (/^[a-zA-Z]:\\[^\n\r]+$/.test(trimmed)) {
              setFolderPathInput(trimmed);
            } else {
              textSetter(prev => (prev ? prev + '\n' + entered : entered));
            }
          }
        }
      };

      const removeImage = (idx) => {
        setAttachedImages(prev => prev.filter((_, i) => i !== idx));
      };

      const removeTextDoc = (idx) => {
        setAttachedTextDocs(prev => prev.filter((_, i) => i !== idx));
      };

      /**
       * Live SSE Streaming Analysis with Real-Time Thinking & Progress Stepper
       */
      const runAnalysis = async (modeOverride, customFollowUp = null, overrideModel = null, forceFullRoadmap = false, scopeOverride = false) => {
        if (voice.isActive()) {
          setError('Stop voice input and review the transcription before submitting.');
          return;
        }
        setLoading(true);
        setError(null);
        setStreamingMarkdown('');
        if (overrideModel) setSelectedModel(overrideModel);
        setThinkingSteps([
          { stepId: 'session', label: 'Remembering your situation', status: 'pending', detail: 'Waiting...', logs: [], liveText: '', expanded: false },
          { stepId: 'rules', label: 'Checking available dates and rules', status: 'pending', detail: 'Waiting...', logs: [], liveText: '', expanded: false },
          { stepId: 'clerk', label: 'Reading your documents', status: 'pending', detail: 'Waiting...', logs: [], liveText: '', expanded: false },
          { stepId: 'evidence', label: 'Finding relevant details', status: 'pending', detail: 'Waiting...', logs: [], liveText: '', expanded: false },
          { stepId: 'llm', label: 'Preparing your answer and next steps', status: 'pending', detail: 'Waiting...', logs: [], liveText: '', expanded: false }
        ]);

        try {
          let mode = modeOverride;
          let caseState = {};
          let initialNotes = '';

          if (door === 'start') {
            mode = 'messy-dump-intake';
            caseState = { role };
            initialNotes = `User Role: ${role === 'complainant' ? 'Complainant (seeking relief/action)' : 'Respondent (responding to a notice, claim, or demand; merits not yet assessed)'}\n\nRaw Story / WhatsApp Chat:\n${storyText}`;
          } else if (door === 'midcase') {
            mode = 'midcase-battle-card';
            caseState = {
              forum,
              stage,
              serviceDate,
              nextHearingDate,
              writtenVersionFiled,
              writtenVersionFiledDate: writtenVersionFiledDate || null,
              complainantEvidenceFiled,
              opEvidenceFiled,
              opEvidenceAdjournmentsGranted: Number(opAdjournments),
              opponentAdjournments: Number(opAdjournments),
              finalOrderDate: finalOrderDate || null,
              lawyerReportedStatus: lawyerReportedStatus || '',
              proposedGapDays: 45
            };
            initialNotes = midcaseNotes;
          } else if (door === 'company') {
            mode = 'company-advisor';
            caseState = { companyNeed };
            initialNotes = `Need Type: ${companyNeed}\nDetails:\n${companyNotes}`;
          } else if (door === 'civil-criminal') {
            mode = 'civil-criminal-advisor';
            caseState = {
              subTrack: civilCriminalSubTrack,
              role: civilCriminalRole,
              keyDate: civilCriminalKeyDate || null,
              dishonourDate: civilCriminalSubTrack === 'cheque-bounce-138' ? (civilCriminalKeyDate || null) : null,
              incidentDate: civilCriminalSubTrack === 'criminal' ? (civilCriminalKeyDate || null) : null,
              causeOfActionDate: civilCriminalKeyDate || null
            };
            initialNotes = `Case Sub-Track: ${civilCriminalSubTrack}\nUser Side: ${civilCriminalRole}\n${civilCriminalKeyDate ? `Key Date: ${civilCriminalKeyDate}\n` : ''}Details:\n${civilCriminalNotes}`;
          } else if (door === 'lawyer-workbench') {
            mode = 'lawyer-research-bench';
            caseState = {
              researchTask: lawyerResearchTask,
              proceedingStage: lawyerProceedingStage
            };
            initialNotes = `Advocate Research Mode: ${lawyerResearchTask}\nProceeding Stage: ${lawyerProceedingStage}\nQuery / Citation / Issue:\n${lawyerNotes}`;
          } else {
            // Unified Single-Box Mode: backend autoSenseIntakeFromText detects new vs ongoing, domain, role, and dates!
            mode = modeOverride || 'auto';
            caseState = {};
            initialNotes = unifiedNotes;
          }

          // If user clicks "Review in more depth" or asks a follow-up before a backend session exists (e.g. after "Load Sample"),
          // preserve the initial case story alongside the follow-up instruction so case facts are never dropped!
          const baseNotes = customFollowUp
            ? (activeSession?.id ? customFollowUp : `${initialNotes}\n\nFollow-Up / Review Request:\n${customFollowUp}`)
            : initialNotes;

          // Zero Re-Upload Optimization:
          // If this session already exists in SQLite (`activeSession.id`), only upload NEW documents or NEW images
          // that were added after the last turn! The backend already holds the full folder + Junior Clerk Digest in SQLite.
          const unsyncedTextDocs = activeSession?.id
            ? attachedTextDocs.filter(d => !syncedDocNames.includes(d.name))
            : attachedTextDocs;

          const unsyncedImages = activeSession?.id
            ? attachedImages.filter(img => !syncedImageNames.includes(img.name))
            : attachedImages;

          const docsBundle = unsyncedTextDocs.length > 0
            ? '\n\nATTACHED FOLDER / TEXT DOCUMENTS:\n' + unsyncedTextDocs.map(d => `=== ${d.name} ===\n${d.content}`).join('\n\n')
            : '';

          const rawInput = baseNotes + docsBundle;

          if (forceFullRoadmap) {
            caseState.forceFullRoadmap = true;
          }

          const res = await fetch('/api/analyze-stream', {
            method: 'POST',
            headers: buildAuthHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({
              userId,
              sessionId: activeSession?.id || null,
              door: door || 'unified',
              mode,
              model: overrideModel || selectedModel,
              caseState,
              forceFullRoadmap: Boolean(forceFullRoadmap),
              scopeOverride: Boolean(scopeOverride),
              rawInput,
              images: unsyncedImages.slice(0, 10),
              folderPath: folderScanSummary?.folderPath || '',
              saveCaseTitle: caseTitle
            })
          });

          if (!res.ok || !res.body) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.error || `Request failed (${res.status})`);
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          let accumulatedMd = '';
          let receivedComplete = false;

          const processSsePart = (part) => {
            const line = part.trim();
            if (!line.startsWith('data:')) return;
            let evt;
            try {
              evt = JSON.parse(line.slice(5).trim());
            } catch {
              return;
            }

            if (evt.type === 'step') {
              setThinkingSteps(prev =>
                prev.map(s =>
                  s.stepId === evt.stepId
                    ? {
                        ...s,
                        status: evt.status,
                        detail: evt.detail,
                        logs: evt.logs || s.logs || [],
                        liveText: evt.liveText !== undefined ? evt.liveText : (s.liveText || ''),
                        expanded: s.expanded
                      }
                    : s
                )
              );
              if (evt.engineResult) {
                if (evt.engineResult.inferredCaseState) {
                  applyInferredStateToForm(evt.engineResult.inferredCaseState);
                }
                setResult(prev => ({
                  ...(prev || {}),
                  engineResult: evt.engineResult,
                  adviceMarkdown: accumulatedMd
                }));
              }
            } else if (evt.type === 'delta') {
              accumulatedMd += evt.delta;
              setStreamingMarkdown(accumulatedMd);
            } else if (evt.type === 'complete') {
              receivedComplete = true;
              setResult(evt);
              setStreamingMarkdown('');
              setTurnRating(0);
              setTurnFeedbackNote('');
              if (evt.userQuota) setUserQuota(evt.userQuota);
              setSyncedDocNames(attachedTextDocs.map(d => d.name));
              setSyncedImageNames(attachedImages.map(i => i.name));
              if (evt.session) {
                setActiveSession(evt.session);
                setCaseTitle(evt.session.title || '');
              }
              if (Array.isArray(evt.sessions)) {
                setSessions(evt.sessions);
              }
            } else if (evt.type === 'error') {
              throw new Error(evt.error || 'Streaming error');
            }
          };

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split('\n\n');
            buffer = parts.pop() || '';
            for (const part of parts) {
              processSsePart(part);
            }
          }
          buffer += decoder.decode();
          if (buffer.trim()) {
            for (const part of buffer.split('\n\n')) {
              processSsePart(part);
            }
          }

          if (!receivedComplete) {
            throw new Error('The connection ended before the answer was confirmed. Do not use any partial draft; retry or check this saved case before continuing.');
          }
          setFollowUpText('');
          setSelectedQuickReplies({});
          await refreshConfig();
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const copyText = (text) => {
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 1800);
      };

      const downloadCourtWordDoc = (mdText, title = 'Nyaya-Legal-Draft') => {
        const htmlBody = renderFormattedMarkdown(mdText).__html;
        const wordHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset='utf-8'><title>${title}</title>
<style>
  body { font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; margin: 1in; color: #000; }
  h1, h2, h3 { font-family: 'Times New Roman', serif; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; margin: 12pt 0; }
  th, td { border: 1px solid #000; padding: 6pt; text-align: left; }
</style></head>
<body>${htmlBody}</body></html>`;
        const blob = new Blob(['\ufeff', wordHtml], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);

        a.href = url;
        a.download = `${(title || 'Nyaya-Legal-Draft').replace(/[^a-zA-Z0-9_-]+/g, '-')}.doc`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

      };

      const printCourtReadyPdf = (mdText, title = 'Nyaya Legal Filing') => {
        const htmlBody = renderFormattedMarkdown(mdText).__html;
        const win = window.open('', '_blank');
        if (!win) return;
        win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${title}</title>
<style>
  @page { margin: 25mm; }
  body { font-family: Georgia, 'Times New Roman', serif; font-size: 11.5pt; line-height: 1.6; color: #111; max-width: 720px; margin: 0 auto; padding: 20px; }
  h1, h2, h3 { color: #000; margin-top: 18px; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 10.5pt; }
  th, td { border: 1px solid #333; padding: 7px 9px; text-align: left; vertical-align: top; }
  blockquote { border-left: 3px solid #000; padding-left: 12px; margin-left: 0; }
</style></head><body>${htmlBody}<script>window.onload = () => { window.print(); };<\/script></body></html>`);
        win.document.close();
      };

      const avgCallCostInr = billing.totals.calls > 0

            method: 'PATCH',
            headers: buildAuthHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ userId, title: cleanTitle })

          if (res.ok) {
            const data = await res.json();
            if (data.session) setActiveSession(prev => ({ ...(prev || {}), title: data.session.title }));
            if (Array.isArray(data.sessions)) setSessions(data.sessions);

                      {historyScope === 'all' && currentUser?.role === 'superadmin'

                        ? `Signed in as ${currentUser.displayName} (${currentUser.email || currentUser.id}) — strictly private to your profile.`

                      <div

                        <button onClick={() => resumeSession(s.id)} class="text-left min-w-0 flex-1 space-y-1">
                          <div class="flex flex-wrap items-center gap-2">
                            <span class="text-xs font-semibold text-zinc-900 truncate">{s.title}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full bg-zinc-100 text-zinc-600 font-medium">

                          </div>
                          <div class="text-[11px] text-zinc-400 mt-0.5">

                    <div class="text-lg font-bold text-zinc-900 mt-0.5">{billing.totals.calls}</div>

                  <div class="p-3 rounded-xl bg-zinc-50 border border-zinc-200">

                    </div>
                  </div>

                    <div class="text-lg font-bold text-zinc-900 mt-0.5">₹{avgCallCostInr.toFixed(2)}</div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Main Content Container */}
          <main class={`flex-1 w-full max-w-2xl mx-auto px-4 sm:px-6 py-5 sm:py-8 flex flex-col ${!door && !(result || streamingMarkdown || loading || activeSession?.turns?.length) ? 'justify-center' : ''}`}>
            {door && <button onClick={goHome} class="self-start mb-4 text-sm text-zinc-500 hover:text-zinc-900">← Home</button>}

            {/* Once a conversation is under way, the big home input steps aside so the answer is the first thing on screen */}
            {!door && Boolean(result || streamingMarkdown || loading || activeSession?.turns?.length) && (
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs text-zinc-500 truncate">{caseTitle || activeSession?.title || 'Your question'}</span>
                <button
                  type="button"
                  onClick={() => startNewBlankSession(null)}

                  class="shrink-0 text-xs font-medium px-3 py-1.5 rounded-lg border border-zinc-200 hover:border-zinc-400 text-zinc-700 transition disabled:opacity-50"

                  ＋ New question
                </button>
              </div>

            {/* ==================== STEP 1: UNIFIED MULTIMODAL OMNIBOX HOME ==================== */}

              <div class="space-y-5">
                <section class="text-center space-y-2 pt-4 sm:pt-10 pb-1">

                </section>

                <div
                  onDragOver={(e) => e.preventDefault()}
                  onDrop={handleDrop}
                  class="relative bg-white rounded-3xl border border-zinc-200 shadow-[0_6px_28px_-10px_rgba(0,0,0,0.18)] focus-within:border-zinc-400 transition"
                >
                  <textarea
                    id="unified-notes"
                    aria-label="Explain your case or legal question"
                    rows="4"
                    value={unifiedNotes}
                    onChange={(e) => setUnifiedNotes(e.target.value)}
                    onPaste={handlePasteEvent}
                    placeholder="Describe your situation or ask any legal question…"

                      type="button"
                      aria-label="Clear"
                      title="Clear"
                      onClick={() => { voice.reset(); setUnifiedNotes(''); setAttachedImages([]); setAttachedTextDocs([]); setFolderScanSummary(null); }}
                      class="absolute top-2 right-2 w-8 h-8 rounded-full text-zinc-400 hover:text-zinc-800 hover:bg-zinc-100 text-sm flex items-center justify-center"
                    >
                      ✕
                    </button>
                  )}
                  {(ingestProgress || attachedImages.length > 0 || attachedTextDocs.length > 0) && (
                    <div class="px-4 sm:px-5 pb-2">{renderAttachmentsAndProgress()}</div>

                  <div class="relative flex items-center justify-between gap-1 px-2 sm:px-3 pb-2.5 pt-1">

                        <input
                          type="file"
                          multiple
                          accept="image/*,audio/*,.pdf,.docx,.zip,.mp3,.wav,.m4a,.ogg,.opus,.webm,.aac,.flac,.txt,.md,.csv,.json,.log,.eml"
                          class="hidden"
                          onChange={handleFileUpload}
                        />

                      <button

                        onClick={() => handleClipboardButtonClick(setUnifiedNotes)}

                      </button>
                      <VoiceInput compact inputId="unified-notes" setText={setUnifiedNotes} voice={voice} disabled={loading || Boolean(ingestProgress)} />
                    </div>
                    <button
                      id="get-started"
                      ref={getStartedButton}
                      onClick={() => runAnalysis('auto')}
                      disabled={loading || Boolean(ingestProgress) || voice.busy || (!unifiedNotes.trim() && attachedImages.length === 0 && attachedTextDocs.length === 0)}
                      class="shrink-0 h-10 px-4 rounded-full bg-zinc-900 text-white text-sm font-semibold hover:bg-zinc-800 transition disabled:bg-zinc-200 disabled:text-zinc-400 whitespace-nowrap"
                    >
                      {loading ? 'Thinking…' : 'Ask Nyaya →'}
                    </button>
                  </div>
                </div>

                {unifiedNotes.trim() && (
                  <p class="text-[11px] text-zinc-500 text-center -mt-2">
                    <span class="px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-900 border border-amber-200">{previewAutoSensedCategory(unifiedNotes)}</span>
                  </p>

                  <div class="text-[11px] font-medium text-zinc-400 px-1">Try an example</div>

                      {[
                        {
                          label: '⌚ Warranty repair refused',
                          text: DOOR_DEMO_CATALOG.start.sampleInput
                        },
                        {
                          label: '🏢 Flat delayed 3 yrs (RERA)',
                          text: 'I booked a flat in Pune in 2021 and paid Rs 72 lakhs. Possession was due Dec 2023. The builder now demands Rs 4.5 lakhs extra and threatens cancellation in 7 days. I want the flat + delay interest.'
                        },
                        {
                          label: '🏛️ Ongoing case: OP delaying',
                          text: 'Notice was served on Opposite Party on 10.03.2026. I already filed my Complainant Evidence Affidavit, but OP has taken 3 adjournments without filing evidence. Next hearing is 09.11.2026.'

                        {
                          label: '🏦 Cheque bounced 27 days ago',
                          text: DOOR_DEMO_CATALOG['civil-criminal'].sampleInput
                        },
                        {
                          label: '🚀 Solo founder: OPC vs Pvt Ltd',
                          text: DOOR_DEMO_CATALOG.company.sampleInput
                        },
                        {
                          label: '⚖️ Advocate: Tofan Singh + Bare Act',

                          onClick={() => setUnifiedNotes(chip.text)}
                          class="shrink-0 whitespace-nowrap text-xs px-3 py-2 rounded-full bg-white border border-zinc-200 shadow-sm hover:bg-amber-50 hover:border-amber-300 text-zinc-700 hover:text-amber-950 transition"

                          {chip.label}
                        </button>

                          <div class="font-semibold text-zinc-900 text-xs">New dispute or claim</div>

                        <span>→</span>
                      </button>
                      <button
                        data-door="midcase"
                        onClick={() => startNewBlankSession('midcase')}

                        <div>

                          <div class="text-[11px] text-zinc-500">Manual hearing dates & stage checkboxes</div>

                        <span>→</span>
                      </button>
                      <button
                        data-door="civil-criminal"

                        <span>→</span>
                      </button>

                      >
                        <div>
                          <div class="font-semibold text-zinc-900 text-xs">⚖️ Advocate Mode: Judgments & Bare Act Workbench</div>
                          <div class="text-[11px] text-zinc-600">Landmark precedents (e.g. Tofan Singh), Bare Acts & oral scripts</div>
                        </div>
                        <span>→</span>
                      </button>
                    </div>
                  </section>
                  </div>
                </details>
              </div>
            )}

            {/* ==================== DOOR 1: START / DEFEND ==================== */}
            {door === 'start' && (
              <div class="space-y-5">
                <div class="space-y-2">
                  <div class="text-xs font-medium uppercase tracking-wider text-zinc-400">A new problem</div>
                  <h2 class="serif-heading text-3xl text-zinc-900">Tell us what happened</h2>
                </div>

                {renderCaseTitleBar()}

                <div class="grid grid-cols-1 sm:grid-cols-2 p-1 rounded-xl bg-zinc-200/70 text-xs font-medium">
                  <button
                    onClick={() => setRole('complainant')}
                    class={`px-3.5 py-2 rounded-lg transition ${role === 'complainant' ? 'bg-white text-zinc-900 shadow-sm' : 'text-zinc-600'}`}
                  >
                    I want to take action / seek relief or refund
                  </button>
                  <button
                    onClick={() => setRole('defender')}
                    class={`px-3.5 py-2 rounded-lg transition ${role === 'defender' ? 'bg-white text-zinc-900 shadow-sm' : 'text-zinc-600'}`}
                  >
                    I need to respond to a notice, claim, or complaint
                  </button>
                </div>

                <div
                  onDragOver={(e) => e.preventDefault()}
                  onDrop={handleDrop}
                  class="bg-white rounded-2xl border border-zinc-200 p-4 space-y-3 shadow-sm"

                    id="story-text"
                    aria-label="Your case story"
                    rows="5"
                    value={storyText}
                    onChange={(e) => setStoryText(e.target.value)}
                    onPaste={handlePasteEvent}
                    placeholder="Paste WhatsApp messages, drop screenshots here, or narrate the story in your own words..."
                    class="w-full text-sm text-zinc-800 placeholder-zinc-400 focus:outline-none resize-y leading-relaxed"
                  />

                  <VoiceInput inputId="story-text" setText={setStoryText} voice={voice} disabled={loading || Boolean(ingestProgress)} />
                  {renderAttachmentsAndProgress()}
                  {renderFolderScannerBar()}

                  <div class="pt-3 border-t border-zinc-100 flex flex-wrap items-center justify-between gap-2">

                        <input
                          type="file"
                          multiple

                        onClick={() => handleClipboardButtonClick(setStoryText)}

                      {!storyText && (
                        <button
                          type="button"
                          onClick={() => { setRole('defender'); setStoryText(DEMO_STORY_TEXT); }}

                        >
                          ✨ Load Sample Chat
                        </button>
                      )}
                      {(storyText || attachedImages.length > 0 || attachedTextDocs.length > 0) && (
                        <button
                          type="button"
                          onClick={() => { voice.reset(); setStoryText(''); setAttachedImages([]); setAttachedTextDocs([]); setFolderScanSummary(null); }}

                          Clear

                      )}
                    </div>

                    <button

                )}

                {result?.engineResult?.advocateResearch && (
                  <div class="p-4 rounded-2xl bg-amber-50/70 border border-amber-200 space-y-3 text-xs">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                      <div class="font-bold text-sm text-zinc-900 flex items-center gap-1.5">
                        <span>📚 Verified Judgment Files, Bare Act Sections & Direct Links</span>
                      </div>
                      <span class="text-[11px] px-2 py-0.5 rounded-full bg-white border border-amber-200 text-amber-950 font-medium">
                        One-Click Courtroom Reference
                      </span>
                    </div>

                    {result.engineResult.advocateResearch.matchedJudgments?.length > 0 && (
                      <div class="space-y-3">
                        {result.engineResult.advocateResearch.matchedJudgments.map(j => (
                          <div key={j.id} class="p-3.5 rounded-xl bg-white border border-amber-200/90 space-y-2.5 shadow-sm">
                            <div class="flex flex-wrap items-start justify-between gap-2">
                              <div>
                                <div class="font-bold text-sm text-zinc-900">{j.caseTitle}</div>
                                <div class="text-xs font-semibold text-amber-900">{j.citation} · {j.courtAndBench}</div>
                              </div>
                              <div class="flex flex-wrap items-center gap-1.5">
                                {j.links?.indianKanoonDocUrl && (
                                  <a
                                    href={j.links.indianKanoonDocUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="px-2.5 py-1 rounded-lg bg-zinc-900 text-white font-semibold hover:bg-zinc-800 transition"
                                  >
                                    📄 Open Full Judgment ↗
                                  </a>
                                )}
                                {j.links?.eScrUrl && (
                                  <a
                                    href={j.links.eScrUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="px-2.5 py-1 rounded-lg border border-zinc-300 bg-zinc-50 text-zinc-800 font-medium hover:border-zinc-500 transition"
                                  >
                                    🏛️ SC e-SCR ↗
                                  </a>
                                )}
                              </div>
                            </div>

                            <div class="text-zinc-700 leading-relaxed">
                              <strong>Key Paragraphs:</strong> {j.keyParagraphs}
                            </div>

                            <div class="space-y-1.5 pt-1 border-t border-zinc-100">
                              <div class="text-[11px] font-semibold uppercase tracking-wider text-zinc-500">
                                Bare Act Sections (Oral Proceeding Reference):
                              </div>
                              {j.bareActProvisions?.map((b, bIdx) => (
                                <div key={bIdx} class="p-2 rounded-lg bg-zinc-50 border border-zinc-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                  <div class="space-y-0.5">
                                    <div class="font-semibold text-zinc-900">{b.act} — <span class="text-amber-900">{b.sections}</span></div>
                                    <div class="text-zinc-600">{b.bareActSummary}</div>
                                  </div>
                                  {b.indiaCodeUrl && (
                                    <a
                                      href={b.indiaCodeUrl}
                                      target="_blank"
                                      rel="noopener noreferrer"
                                      class="px-2.5 py-1 rounded-lg bg-white border border-zinc-300 text-zinc-800 font-medium hover:border-zinc-900 whitespace-nowrap self-start sm:self-center"
                                    >
                                      📘 Bare Act (IndiaCode) ↗
                                    </a>
                                  )}
                                </div>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    {result.engineResult.advocateResearch.directLinks?.length > 0 && (
                      <div class="flex flex-wrap items-center gap-2 pt-1">
                        {result.engineResult.advocateResearch.directLinks.map((lnk, lIdx) => (
                          <a
                            key={lIdx}
                            href={lnk.url}
                            target="_blank"
                            rel="noopener noreferrer"
                            class="px-2.5 py-1 rounded-lg bg-white border border-amber-300 text-amber-950 font-medium hover:bg-amber-100 transition"
                          >
                            {lnk.label} ↗
                          </a>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {result?.engineResult?.practitionerIntelligence && (
                  <details open={Boolean(loading && !streamingMarkdown)} class="p-3 rounded-2xl bg-zinc-50 border border-zinc-200/90 space-y-3 text-xs">
                    <summary class="cursor-pointer font-semibold text-zinc-800 flex flex-wrap items-center justify-between gap-2">
                      <span>⚖️ Verified Statutory Applicability, Bare Act Cluster & Practitioner Checks</span>
                      <span class="text-[11px] text-amber-900 font-medium">
                        {result.engineResult.practitionerIntelligence.semanticStatutoryCluster?.[0]?.section || 'Click to inspect statutory rules'}
                      </span>
                    </summary>

                    <div class="pt-2.5 space-y-3 border-t border-zinc-200/70">
                      {result.engineResult.practitionerIntelligence.instantTriage && (
                        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-2 pb-2 border-b border-zinc-200/70">
                          <div class="space-y-1">
                            <div class="flex flex-wrap items-center gap-1.5">
                              <span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-950 font-semibold text-[10px] uppercase tracking-wider">
                                ⚡ Instant Triage
                              </span>
                              <span class="font-bold text-zinc-900">
                                {result.engineResult.practitionerIntelligence.instantTriage.headline}
                              </span>
                            </div>
                            <p class="text-zinc-700 leading-relaxed">
                              <strong>Immediate First Move:</strong> {result.engineResult.practitionerIntelligence.instantTriage.firstMoveNow}
                            </p>
                          </div>
                        </div>
                      )}

                      {(result.engineResult.practitionerIntelligence.maintainabilityAudit?.ousters?.length > 0 ||
                        result.engineResult.practitionerIntelligence.maintainabilityAudit?.limitationChecks?.length > 0 ||
                        result.engineResult.practitionerIntelligence.maintainabilityAudit?.arbitration ||
                        result.engineResult.practitionerIntelligence.paperTrailAudit?.oralOnlyDeficit ||
                        result.engineResult.practitionerIntelligence.paperTrailAudit?.selfGoals?.length > 0 ||
                        result.engineResult.practitionerIntelligence.forumElection ||
                        result.engineResult.practitionerIntelligence.flankRisks?.length > 0) && (
                        <div class="p-2.5 rounded-xl bg-white border border-indigo-200/90 space-y-2">
                          <div class="font-semibold text-indigo-950 flex flex-wrap items-center justify-between gap-2">
                            <span>🏛️ Senior-Counsel Threshold Check — Maintainability, Deadlines, Forum Election & Flanks</span>
                            {result.engineResult.practitionerIntelligence.jurisdictionState?.state && (
                              <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-50 border border-indigo-200 text-indigo-900 font-medium">
                                📍 {result.engineResult.practitionerIntelligence.jurisdictionState.state}
                              </span>
                            )}
                          </div>

                          {result.engineResult.practitionerIntelligence.jurisdictionState?.localLawNote && (
                            <div class="text-zinc-600 leading-relaxed">
                              <strong>State law note:</strong> {result.engineResult.practitionerIntelligence.jurisdictionState.localLawNote}
                            </div>
                          )}

                          {result.engineResult.practitionerIntelligence.maintainabilityAudit?.limitationChecks?.map(lc => (
                            <div key={lc.id} class={`p-2 rounded-lg border ${
                              lc.status === 'barred-hard-ceiling'
                                ? 'bg-red-50 border-red-200 text-red-950'
                                : lc.status === 'extension-window-only' || lc.status === 'delayed-condonation-needed'
                                ? 'bg-amber-50 border-amber-200 text-amber-950'
                                : 'bg-zinc-50 border-zinc-200 text-zinc-800'
                            }`}>
                              <div class="font-semibold">
                                ⏱️ {lc.label}: {lc.status === 'date-needed'
                                  ? 'date needed to compute'
                                  : lc.status === 'barred-hard-ceiling'
                                  ? `outer limit of ${lc.outerDays} days has passed`
                                  : lc.status === 'delayed-condonation-needed'
                                  ? `${lc.daysElapsed} days elapsed — condonation application needed`
                                  : lc.status === 'extension-window-only'
                                  ? `in the extension window (${lc.daysRemaining} day(s) left)`
                                  : `within time (${lc.daysRemaining} day(s) left of ${lc.outerDays})`}
                              </div>
                              <div class="text-zinc-600 leading-relaxed">{lc.rule}{lc.verifyNote ? ` ${lc.verifyNote}` : ''}</div>
                            </div>
                          ))}

                          {result.engineResult.practitionerIntelligence.maintainabilityAudit?.ousters?.map(o => (
                            <div key={o.id} class="p-2 rounded-lg bg-zinc-50 border border-zinc-200 space-y-0.5">
                              <div class="font-semibold text-zinc-900">🚫 Civil court barred — {o.statute}, {o.section}</div>
                              <div class="text-zinc-700"><strong>Correct forum:</strong> {o.exclusiveForum}</div>
                              {o.exception && <div class="text-zinc-500">{o.exception}</div>}
                              {o.verifyNote && <div class="text-amber-800">{o.verifyNote}</div>}
                            </div>
                          ))}

                          {result.engineResult.practitionerIntelligence.maintainabilityAudit?.arbitration && (
                            <div class="p-2 rounded-lg bg-zinc-50 border border-zinc-200 space-y-0.5">
                              <div class="font-semibold text-zinc-900">📑 Arbitration clause in the contract</div>
                              <div class="text-zinc-700">{result.engineResult.practitionerIntelligence.maintainabilityAudit.arbitration.statutoryOverride}</div>
                              {result.engineResult.practitionerIntelligence.maintainabilityAudit.arbitration.unilateralAppointmentDetected && (
                                <div class="text-amber-900">{result.engineResult.practitionerIntelligence.maintainabilityAudit.arbitration.unilateralAppointmentRule}</div>
                              )}
                            </div>
                          )}

                          {result.engineResult.practitionerIntelligence.paperTrailAudit?.stepZeroAdvice && (
                            <div class="p-2 rounded-lg bg-amber-50 border border-amber-200 text-amber-950">
                              <strong>📄 Step 0 — Create a paper trail:</strong> {result.engineResult.practitionerIntelligence.paperTrailAudit.stepZeroAdvice}
                            </div>
                          )}
                          {result.engineResult.practitionerIntelligence.paperTrailAudit?.selfGoals?.map(sg => (
                            <div key={sg.id} class="p-2 rounded-lg bg-amber-50 border border-amber-200 text-amber-950 space-y-0.5">
                              <div class="font-semibold">⚠️ {sg.issue}</div>
                              <div class="text-zinc-700">{sg.counterMove}</div>
                            </div>
                          ))}

                          {result.engineResult.practitionerIntelligence.forumElection && (
                            <div class="p-2 rounded-lg bg-zinc-50 border border-zinc-200 space-y-1.5">
                              <div class="font-semibold text-zinc-900">⚖️ Doctrine of Election: {result.engineResult.practitionerIntelligence.forumElection.electionRule}</div>
                              <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-[11px]">
                                  <thead>
                                    <tr class="border-b border-zinc-200 text-zinc-500">
                                      <th class="py-1 pr-2">Route</th>
                                      <th class="py-1 pr-2">Best for</th>
                                      <th class="py-1 pr-2">Day-1 interim power</th>
                                      <th class="py-1 pr-2">How it is enforced</th>
                                    </tr>
                                  </thead>
                                  <tbody class="divide-y divide-zinc-200/60">
                                    {result.engineResult.practitionerIntelligence.forumElection.options.map((op, oIdx) => (
                                      <tr key={oIdx}>
                                        <td class="py-1 pr-2 font-medium text-zinc-900">{op.forum}</td>
                                        <td class="py-1 pr-2 text-zinc-700">{op.bestFor}</td>
                                        <td class="py-1 pr-2 text-zinc-700">{op.interimPower}</td>
                                        <td class="py-1 pr-2 text-zinc-700">{op.executionTeeth}</td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          )}

                          {result.engineResult.practitionerIntelligence.flankRisks?.map(fr => (
                            <div key={fr.id} class="p-2 rounded-lg bg-zinc-50 border border-zinc-200 space-y-0.5">
                              <div class="font-semibold text-zinc-900">🛡️ Flank: {fr.risk}</div>
                              <div class="text-zinc-700">{fr.shield}</div>
                            </div>
                          ))}
                        </div>
                      )}

                      {result.engineResult.practitionerIntelligence.semanticStatutoryCluster?.length > 0 && (
                        <div class="p-2.5 rounded-xl bg-white border border-zinc-200/90 space-y-2">
                          <div class="font-semibold text-zinc-900 flex flex-wrap items-center justify-between gap-2">
                            <span>🧬 SQLite Semantic Vector + Adjacent Bare Act Cluster ({result.engineResult.practitionerIntelligence.semanticStatutoryCluster.length} provisions · 384-dim embeddings)</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full bg-zinc-100 text-zinc-600 font-medium">Base vs. Aggravated Check</span>
                          </div>
                          <div class="space-y-2">
                            {result.engineResult.practitionerIntelligence.semanticStatutoryCluster.map(sp => (
                              <div key={sp.id} class="p-2.5 rounded-lg bg-zinc-50 border border-zinc-200/80 space-y-1">
                                <div class="flex flex-wrap items-center justify-between gap-1.5">
                                  <span class="font-bold text-zinc-900">{sp.section} — {sp.title}</span>
                                  <span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-50 border border-amber-200 text-amber-950 font-medium">
                                    {sp.cognizable} · {sp.bailable} · Max: {sp.maxPunishment}
                                  </span>
                                </div>
                                <div class="text-zinc-600 leading-relaxed">{sp.practitionerEscalationNote}</div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {result.engineResult.practitionerIntelligence.ingredientTranslations?.length > 0 && (
                        <div class="space-y-1.5">
                          <div class="text-[11px] font-semibold uppercase tracking-wider text-amber-900">
                            🔍 Everyday Term → Actual Legal Ingredient Check
                          </div>
                          {result.engineResult.practitionerIntelligence.ingredientTranslations.map(tr => (
                            <div key={tr.id} class="p-2.5 rounded-xl bg-white border border-amber-200/90 space-y-1">
                              <div class="font-semibold text-zinc-900">
                                “{tr.laymanTerm}” → <span class="text-amber-900">{tr.actualLegalConcept}</span>
                              </div>
                              <div class="text-zinc-600 leading-relaxed">{tr.explanation}</div>
                            </div>
                          ))}
                        </div>
                      )}

                      {result.engineResult.practitionerIntelligence.factProbing?.firCognizabilityAnalysis && (
                        <div class="p-2.5 rounded-xl bg-white border border-purple-200/90 space-y-1">
                          <div class="font-semibold text-purple-950">
                            🛡️ BNSS First Schedule & Police Station Check: {result.engineResult.practitionerIntelligence.factProbing.firCognizabilityAnalysis.scheduleStatus}
                          </div>
                          <div class="text-zinc-600 leading-relaxed">
                            {result.engineResult.practitionerIntelligence.factProbing.firCognizabilityAnalysis.whyPoliceRefused}
                          </div>
                          <div class="text-zinc-800 font-medium pt-0.5">
                            What to do at the Thana: {result.engineResult.practitionerIntelligence.factProbing.firCognizabilityAnalysis.whatToTellPoliceOrDo}
                          </div>
                        </div>
                      )}

                      {result.engineResult.practitionerIntelligence.foresightAndPrayer?.prayerClauseAudit && (
                        <div class={`p-2.5 rounded-xl border space-y-1.5 ${
                          result.engineResult.practitionerIntelligence.foresightAndPrayer.prayerClauseAudit.status === 'COMPLETE'
                            ? 'bg-emerald-50/70 border-emerald-200 text-emerald-950'
                            : 'bg-amber-50/80 border-amber-300 text-amber-950'
                        }`}>
                          <div class="font-bold">
                            📜 Plaint / Petition “Prayer Clause” Audit: {result.engineResult.practitionerIntelligence.foresightAndPrayer.prayerClauseAudit.status === 'COMPLETE' ? 'All Core Reliefs Present' : 'Missing Reliefs Detected Before Filing'}
                          </div>
                          {result.engineResult.practitionerIntelligence.foresightAndPrayer.prayerClauseAudit.missingPrayers?.length > 0 && (
                            <ul class="list-disc pl-4 space-y-0.5 text-zinc-800">
                              {result.engineResult.practitionerIntelligence.foresightAndPrayer.prayerClauseAudit.missingPrayers.map((mp, idx) => (
                                <li key={idx}><strong>Add to Prayer:</strong> {mp}</li>
                              ))}
                            </ul>
                          )}
                          <div class="text-[11px] text-zinc-600">
                            {result.engineResult.practitionerIntelligence.foresightAndPrayer.prayerClauseAudit.practitionerRule}
                          </div>
                        </div>
                      )}

                      {(result.engineResult.practitionerIntelligence.foresightAndPrayer?.downstreamWarnings?.length > 0 ||
                        result.engineResult.practitionerIntelligence.matchedTrajectories?.length > 0) && (
                        <div class="space-y-2">
                          {result.engineResult.practitionerIntelligence.foresightAndPrayer?.burdenOfProofGuide && (
                            <div class="p-2.5 rounded-xl bg-white border border-zinc-200 space-y-0.5">
                              <div class="font-semibold text-zinc-900">
                                ⚖️ Standard & Burden of Proof: {result.engineResult.practitionerIntelligence.foresightAndPrayer.burdenOfProofGuide.category}
                              </div>
                              <div class="text-zinc-600 leading-relaxed">
                                {result.engineResult.practitionerIntelligence.foresightAndPrayer.burdenOfProofGuide.principle}
                              </div>
                            </div>
                          )}
                          {result.engineResult.practitionerIntelligence.foresightAndPrayer?.downstreamWarnings?.map(w => (
                            <div key={w.id} class="p-2.5 rounded-xl bg-white border border-amber-200 space-y-0.5">
                              <div class="font-semibold text-amber-950">{w.title}</div>
                              <div class="text-zinc-600 leading-relaxed">{w.detail}</div>
                            </div>
                          ))}
                          {result.engineResult.practitionerIntelligence.matchedTrajectories?.map(trj => (
                            <div key={trj.id} class="p-2.5 rounded-xl bg-white border border-zinc-200 space-y-1">
                              <div class="font-semibold text-zinc-900">🧭 Practitioner Trajectory: {trj.title}</div>
                              <div class="text-zinc-500"><strong>Why people get stuck:</strong> {trj.wherePeopleGetStuck}</div>
                              <ul class="list-disc pl-4 space-y-0.5 text-zinc-700">
                                {trj.practitionerTurnOfEvents.map((st, sIdx) => (
                                  <li key={sIdx}>{st}</li>
                                ))}
                              </ul>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </details>
                )}

                        {currentUser?.role === 'superadmin' && (
                          <div class="text-[11px] text-zinc-500">
                            Model: <strong class="text-zinc-800">{result.model}</strong> · Tokens: {result.billingEntry?.totalTokens || 0} · ₹{(result.billingEntry?.estimatedInr || 0).toFixed(3)} · {((result.billingEntry?.latencyMs || 0) / 1000).toFixed(1)}s
                          </div>
                        )}
                      </div>
                    </details>
                  </>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    const sharedPathMatch = window.location.pathname.match(/^\/share\/([A-Za-z0-9_-]{20,})$/);
    root.render(sharedPathMatch ? <SharedConversationView token={sharedPathMatch[1]} /> : <App />);
  </script>
</body>
</html>
