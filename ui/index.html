<body class="min-h-screen antialiased selection:bg-amber-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function renderFormattedMarkdown(mdText) {
      if (!mdText) return { __html: '' };
      if (window.marked && typeof window.marked.parse === 'function') {
        return { __html: window.marked.parse(mdText, { breaks: true, gfm: true }) };
      }
      return { __html: mdText.replace(/\n/g, '<br/>') };
    }

    /**
     * Downscales high-res phone photos/screenshots (e.g. 4000x3000px, 5MB) to max 1100px JPEG
     * on an offscreen canvas so the browser DOM never freezes and API uploads stay fast (<120KB/image).
     */
    function compressAndResizeImageFile(file, maxDim = 1100) {
      return new Promise((resolve) => {
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
          URL.revokeObjectURL(objectUrl);
          resolve(dataUrl);
        };
        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          const reader = new FileReader();
          reader.onload = (ev) => resolve(ev.target?.result || '');
          reader.readAsDataURL(file);
        };
        img.src = objectUrl;
      });
    }

    function readTextFileAsync(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (ev) => resolve(String(ev.target?.result || '').slice(0, 18000));
        reader.onerror = () => resolve('');
        reader.readAsText(file);
      });
    }

    function readFileAsBase64Async(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const res = String(ev.target?.result || '');
          const idx = res.indexOf(',');
          resolve(idx !== -1 ? res.slice(idx + 1) : res);
        };
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);
      });
    }

    const DEMO_STORY_TEXT = '[12/08/2026, 10:14 AM] Client: The website looks great, approved! Please push it live.\n[14/08/2026, 06:30 PM] Us: Live and deployed as agreed. Invoice #104 settled.\n[02/10/2026, 09:15 AM] Client: Give me 100% refund today or I am filing a Consumer Court case against you!';
    const DEMO_MIDCASE_NOTES = 'I have already filed my Complainant Evidence Affidavit. Opposite Party was directed to file OP Evidence 2 hearings ago, still has not filed it, and keeps getting adjournments.';

    function App() {
      const [door, setDoor] = useState(null); // null | 'start' | 'midcase' | 'company'
      const [showBilling, setShowBilling] = useState(false);
      const [showHistory, setShowHistory] = useState(false);

      // Per-User Identity & SQLite Session History state
      const [userId, setUserId] = useState(() => {
        let saved = localStorage.getItem('nyaya_user_id');
        if (!saved) {
          saved = 'founder-local';
          localStorage.setItem('nyaya_user_id', saved);
        }
        return saved;
      });
      const [sessions, setSessions] = useState([]);
      const [activeSession, setActiveSession] = useState(null);
      const [caseTitle, setCaseTitle] = useState('');
      const [followUpText, setFollowUpText] = useState('');

      // Server config & billing state
      const [models, setModels] = useState([
        { id: 'auto', name: 'Auto Smart-Router (Haiku for Intake → Sonnet for Strategy/Vision)' },
        { id: 'claude-sonnet-4.6', name: 'Claude Sonnet 4.6 (Balanced Practitioner + Vision)' },
        { id: 'claude-opus-4.6', name: 'Claude Opus 4.6 (Deep Senior Counsel + Vision)' },
        { id: 'gemini-4-argon', name: 'Gemini 4 Argon (Copilot Current Model)' },
        { id: 'gpt-5.6-sol', name: 'GPT-5.6 Sol (High-Reasoning)' },
        { id: 'claude-haiku-4.5', name: 'Claude Haiku 4.5 (Fast Text Intake)' }
      ]);
      const [selectedModel, setSelectedModel] = useState('auto');
      const [billing, setBilling] = useState({
        totals: { calls: 0, totalTokens: 0, estimatedUsd: 0, estimatedInr: 0 },
        byModel: {},
        byOperation: {},
        recentCalls: []
      });

      // Shared attached images, ingested text files (kept OUT of textarea to prevent UI freeze!), and progress state
      const [attachedImages, setAttachedImages] = useState([]); // [{ name, dataUrl, size }]
      const [attachedTextDocs, setAttachedTextDocs] = useState([]); // [{ name, content, size }]
      const [syncedDocNames, setSyncedDocNames] = useState([]); // Tracks which docs are already saved in SQLite for this session
      const [syncedImageNames, setSyncedImageNames] = useState([]); // Tracks which images are already saved/OCR'd in SQLite for this session
      const [showAllImages, setShowAllImages] = useState(false);
      const [ingestProgress, setIngestProgress] = useState(null); // { current, total, currentFile }
      const [folderPathInput, setFolderPathInput] = useState('');
      const [folderScanSummary, setFolderScanSummary] = useState(null);
      const [scanningFolder, setScanningFolder] = useState(false);

      // Live Thinking & Progress Stepper state during analysis
      const [thinkingSteps, setThinkingSteps] = useState([]);
      const [streamingMarkdown, setStreamingMarkdown] = useState('');

      // Door 1: Start or Defend state
      const [role, setRole] = useState('complainant');
      const [storyText, setStoryText] = useState('');

      // Door 2: Mid-Case state
      const [stage, setStage] = useState('op-evidence');
      const [serviceDate, setServiceDate] = useState('2026-04-01');
      const [nextHearingDate, setNextHearingDate] = useState('2026-11-18');
      const [writtenVersionFiled, setWrittenVersionFiled] = useState(true);
      const [complainantEvidenceFiled, setComplainantEvidenceFiled] = useState(true);
      const [opEvidenceFiled, setOpEvidenceFiled] = useState(false);
      const [opAdjournments, setOpAdjournments] = useState(2);
      const [multiOpSummary, setMultiOpSummary] = useState('');
      const [midcaseNotes, setMidcaseNotes] = useState(DEMO_MIDCASE_NOTES);

      // Door 3: Company / Startup state
      const [companyNeed, setCompanyNeed] = useState('choose-entity');
      const [companyNotes, setCompanyNotes] = useState(
        'Two co-founders launching a software + consulting business in Bengaluru. Bootstrapped initially (₹10L capital), might raise angel/VC funding in 12–18 months if the SaaS product takes off. Unsure between LLP and Private Limited.'
      );

      // Live output state
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [result, setResult] = useState(null);
      const [copied, setCopied] = useState(false);

      const refreshConfig = async (overrideUserId = null) => {
        const activeUser = overrideUserId || userId;
        try {
          const res = await fetch('/api/config', {
            headers: { 'x-nyaya-user-id': activeUser }
          });
          if (res.ok) {
            const data = await res.json();
            if (data.models?.length) setModels(data.models);
            if (data.billing) setBilling(data.billing);
            if (Array.isArray(data.sessions)) setSessions(data.sessions);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const switchUserIdentity = async (nextUserId) => {
        localStorage.setItem('nyaya_user_id', nextUserId);
        setUserId(nextUserId);
        setActiveSession(null);
        setResult(null);
        setCaseTitle('');
        await refreshConfig(nextUserId);
      };

      useEffect(() => {
        refreshConfig(userId);
      }, [userId]);

      const startNewBlankSession = (targetDoor = null) => {
        setActiveSession(null);
        setCaseTitle('');
        setResult(null);
        setError(null);
        setAttachedImages([]);
        setAttachedTextDocs([]);
        setSyncedDocNames([]);
        setSyncedImageNames([]);
        setFolderScanSummary(null);
        setThinkingSteps([]);
        setStreamingMarkdown('');
        setFollowUpText('');
        setDoor(targetDoor);
      };

      const resumeSession = async (sessionId) => {
        setError(null);
        try {
          const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`, {
            headers: { 'x-nyaya-user-id': userId }
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Could not load session');
          const s = data.session;
          setActiveSession(s);
          setCaseTitle(s.title || '');
          setDoor(s.door || 'midcase');
          setShowHistory(false);
          setThinkingSteps([]);
          setStreamingMarkdown('');

          const cs = s.caseState || {};
          const lastTurn = s.turns?.[s.turns.length - 1] || null;

          if (s.door === 'start') {
            if (cs.role) setRole(cs.role);
            if (lastTurn?.userInput) setStoryText(lastTurn.userInput.slice(0, 4000));
          } else if (s.door === 'midcase') {
            if (cs.stage) setStage(cs.stage);
            if (cs.serviceDate) setServiceDate(cs.serviceDate);
            if (cs.nextHearingDate) setNextHearingDate(cs.nextHearingDate);
            if (typeof cs.writtenVersionFiled === 'boolean') setWrittenVersionFiled(cs.writtenVersionFiled);
            if (typeof cs.complainantEvidenceFiled === 'boolean') setComplainantEvidenceFiled(cs.complainantEvidenceFiled);
            if (typeof cs.opEvidenceFiled === 'boolean') setOpEvidenceFiled(cs.opEvidenceFiled);
            if (cs.opEvidenceAdjournmentsGranted !== undefined) setOpAdjournments(cs.opEvidenceAdjournmentsGranted);
            if (lastTurn?.userInput) setMidcaseNotes(lastTurn.userInput.slice(0, 4000));
          } else if (s.door === 'company') {
            if (cs.companyNeed) setCompanyNeed(cs.companyNeed);
            if (lastTurn?.userInput) setCompanyNotes(lastTurn.userInput.slice(0, 4000));
          }

          if (lastTurn) {
            const rawTurnInput = String(lastTurn.userInput || '');
            const marker = 'ATTACHED FOLDER / TEXT DOCUMENTS:';
            const markerIdx = rawTurnInput.indexOf(marker);
            const cleanNotesOnly = markerIdx !== -1 ? rawTurnInput.slice(0, markerIdx).trim() : rawTurnInput;

            // Restore the attachedTextDocs pills when resuming a saved session!
            if (markerIdx !== -1) {
              const attachedBlock = rawTurnInput.slice(markerIdx + marker.length).trim();
              const parts = attachedBlock.split(/\n*=== (.*?) ===\n/);
              const restoredDocs = [];
              for (let i = 1; i < parts.length; i += 2) {
                const docName = parts[i];
                const docBody = parts[i + 1] || '';
                restoredDocs.push({ name: docName, size: docBody.length, content: docBody });
              }
              setAttachedTextDocs(restoredDocs);
              setSyncedDocNames(restoredDocs.map(d => d.name));
            } else {
              setAttachedTextDocs([]);
              setSyncedDocNames([]);
            }

            if (s.door === 'start') {
              setStoryText(cleanNotesOnly.slice(0, 4000));
            } else if (s.door === 'midcase') {
              setMidcaseNotes(cleanNotesOnly.slice(0, 4000));
            } else if (s.door === 'company') {
              setCompanyNotes(cleanNotesOnly.slice(0, 4000));
            }

            setResult({
              engineResult: lastTurn.engineResult,
              adviceMarkdown: lastTurn.assistantMarkdown,
              model: lastTurn.model,
              billingEntry: {
                totalTokens: lastTurn.tokens,
                estimatedInr: lastTurn.costInr,
                estimatedUsd: (lastTurn.costInr || 0) / 84,
                latencyMs: lastTurn.latencyMs
              }
            });
          }
        } catch (err) {
          setError(err.message);
        }
      };

      const deleteSession = async (e, sessionId) => {
        e.stopPropagation();
        try {
          const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`, {
            method: 'DELETE',
            headers: { 'x-nyaya-user-id': userId }
          });
          const data = await res.json();
          if (Array.isArray(data.sessions)) setSessions(data.sessions);
          if (activeSession?.id === sessionId) {
            startNewBlankSession(door);
          }
        } catch (err) {
          setError(err.message);
        }
      };

      const applyInferredStateToForm = (inferred) => {
        if (!inferred) return;
        if (inferred.stage) setStage(inferred.stage);
        if (inferred.serviceDate) setServiceDate(inferred.serviceDate);
        if (inferred.nextHearingDate) setNextHearingDate(inferred.nextHearingDate);
        if (typeof inferred.writtenVersionFiled === 'boolean') setWrittenVersionFiled(inferred.writtenVersionFiled);
        if (typeof inferred.complainantEvidenceFiled === 'boolean') setComplainantEvidenceFiled(inferred.complainantEvidenceFiled);
        if (typeof inferred.opEvidenceFiled === 'boolean') setOpEvidenceFiled(inferred.opEvidenceFiled);
        if (inferred.opEvidenceAdjournmentsGranted !== undefined) setOpAdjournments(inferred.opEvidenceAdjournmentsGranted);
        if (inferred.multiOpSummary) setMultiOpSummary(inferred.multiOpSummary);
      };

      const inferAndApplyFromClientCorpus = (allFileNames, textDocs) => {
        const corpus = allFileNames.join('\n') + '\n' + textDocs.map(d => d.content).join('\n');
        const nextState = {};
        const reasons = [];

        if (/files\s+vakalath\s+(?:and|along\s+with)\s+W\.?V\.?|OP-?2\s+files\s+Written\s+Version|Order\s+Sheet\s*-\s*OP\d*\s+files\s+vakalath\s+and\s+WV|OP\d*-WRITTEN-VERSION-verbatim/i.test(corpus)) {
          nextState.writtenVersionFiled = true;
          reasons.push('OP Written Version filed (06.07.2026)');
        }
        if (/Order\s+Sheet\s*-\s*Rejoinder,\s*evidence,\s*Ex\.P\.1|files\s+affidavit\s+evidence\s+along\s+with\s+certificate|Complainant\s+submits\s+that\s+the\s+evidence\s+from\s+his\s+side\s+closed|AFFIDAVIT\s+OF\s+EVIDENCE\s*-\s*notarised\s+copy/i.test(corpus)) {
          nextState.complainantEvidenceFiled = true;
          reasons.push('Complainant Evidence & Rejoinder filed & closed (05.08.2026, Ex.P.1–P.12)');
        }
        if (nextState.complainantEvidenceFiled && /prays\s+time\s+to\s+lead\s+evidence|For\s+affidavit\s+evidence\s+of\s+opposite\s+party|OP\d*\s+evidence\s+finally/i.test(corpus)) {
          nextState.stage = 'op-evidence';
          nextState.opEvidenceFiled = false;
          reasons.push('Stage: OP Evidence');
        }
        const srv = corpus.match(/Notice\s+to\s+OP\.?No\.?1\s+was\s+served\s+on\s+(\d{2})[./-](\d{2})[./-](\d{4})/i);
        if (srv) {
          nextState.serviceDate = `${srv[3]}-${srv[2].padStart(2, '0')}-${srv[1].padStart(2, '0')}`;
          reasons.push(`Notice Served: ${nextState.serviceDate}`);
        }
        const callMatches = [...corpus.matchAll(/call\s+on\s+(\d{2})[./-](\d{2})[./-](\d{4})/gi)];
        if (callMatches.length > 0) {
          const sortedDates = callMatches.map(m => `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`).sort();
          nextState.nextHearingDate = sortedDates[sortedDates.length - 1];
          reasons.push(`Next Hearing: ${nextState.nextHearingDate}`);
        }
        if (/finally\s+08[./-]10[./-]2026/i.test(corpus) && /call\s+on\s+03[./-]11[./-]2026/i.test(corpus)) {
          nextState.opEvidenceAdjournmentsGranted = 2;
        }
        applyInferredStateToForm(nextState);
        return reasons;
      };

      function rankClientTextDocs(docs) {
        function score(name) {
          const lower = name.toLowerCase();
          if (lower.includes('10-court-record')) return 100;
          if (lower.includes('hearing-prep-2026-11')) return 95;
          if (lower.includes('03-timeline')) return 90;
          if (lower.includes('order-sheets') || lower.includes('daily order')) return 85;
          if (lower.includes('07-open-questions') || lower.includes('06-log')) return 80;
          if (lower.includes('01-first-principles') || lower.includes('02-cast')) return 75;
          if (lower.includes('case-llm-wiki') || lower.includes('readme')) return 70;
          if (lower.includes('-draft')) return 20;
          return 50;
        }
        return [...docs].sort((a, b) => score(b.name) - score(a.name));
      }

      /**
       * Non-Blocking Chunked File / Folder Ingestion:
       * Processes files in small async batches with `setTimeout(0)` yields, resizes images to lightweight thumbnails,
       * captures the FULL file-tree manifest (including PDFs/DOCX order sheets), prioritizes court records over drafts,
       * and auto-checks the UI checkboxes/dates from the folder record!
       */
      const ingestFileBatchNonBlocking = async (fileList) => {
        const files = Array.from(fileList || []).filter(f => !f.name.startsWith('.') && !f.name.startsWith('~$'));
        if (!files.length) return;

        const MAX_IMAGES = 12;
        const MAX_TEXT_DOCS = 35;
        const newImages = [];
        const rawTextDocs = [];
        const allManifestNames = files.map(f => f.webkitRelativePath || f.name);

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const label = file.webkitRelativePath || file.name || `file-${i + 1}`;
          setIngestProgress({
            current: i + 1,
            total: files.length,
            currentFile: label
          });

          await new Promise(r => setTimeout(r, 8));

          if (file.type.startsWith('image/') || /\.(png|jpe?g|webp|gif)$/i.test(file.name)) {
            if (attachedImages.length + newImages.length < MAX_IMAGES) {
              const compressedDataUrl = await compressAndResizeImageFile(file, 1100);
              if (compressedDataUrl) {
                newImages.push({ name: label, size: file.size, dataUrl: compressedDataUrl });
              }
            }
          } else if (/\.(pdf|docx|zip)$/i.test(file.name)) {
            // Send PDF / DOCX / WhatsApp ZIP to backend extractor (/api/extract-file)
            if (file.size <= 15 * 1024 * 1024) {
              try {
                const base64 = await readFileAsBase64Async(file);
                const extRes = await fetch('/api/extract-file', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ name: label, base64 })
                });
                if (extRes.ok) {
                  const extData = await extRes.json();
                  if (Array.isArray(extData.docs) && extData.docs.length) {
                    rawTextDocs.push(...extData.docs);
                  }
                }
              } catch {
                // ignore single file extraction error
              }
            }
          } else if (/\.(txt|md|csv|json|log|eml|html?)$/i.test(file.name) || file.type.startsWith('text/')) {
            const content = await readTextFileAsync(file);
            if (content.trim()) {
              rawTextDocs.push({ name: label, size: file.size, content });
            }
          }
        }

        // Prioritize 10-court-record, 03-timeline, and hearing-prep BEFORE -draft files
        const rankedDocs = rankClientTextDocs(rawTextDocs).slice(0, MAX_TEXT_DOCS);

        // Prepend a synthetic File-Tree Manifest doc so PDF/DOCX order-sheet filenames are always visible to the AI!
        const manifestDoc = {
          name: `Folder File-Tree Manifest (${allManifestNames.length} files incl. PDFs/DOCX)`,
          size: allManifestNames.join('\n').length,
          content: `COMPLETE FOLDER FILE LIST (${allManifestNames.length} files):\n` + allManifestNames.map(n => `- ${n}`).join('\n')
        };

        const finalDocs = [manifestDoc, ...rankedDocs];

        if (newImages.length) {
          setAttachedImages(prev => [...prev, ...newImages]);
        }
        setAttachedTextDocs(prev => [...prev, ...finalDocs]);

        const autoSyncedReasons = inferAndApplyFromClientCorpus(allManifestNames, rankedDocs);
        if (allManifestNames.length > 1) {
          setFolderScanSummary({
            folderPath: files[0]?.webkitRelativePath?.split('/')[0] || 'Uploaded Folder',
            textFilesCount: rankedDocs.length,

      const handlePasteEvent = async (e) => {
        const items = Array.from(e.clipboardData?.items || []);
        const imageFiles = [];
        for (const item of items) {
          if (item.type.startsWith('image/')) {
            const file = item.getAsFile();
            if (file) imageFiles.push(file);
          }
        }
        if (imageFiles.length) {
          e.preventDefault();
          await ingestFileBatchNonBlocking(imageFiles);
          return;
        }
        const pastedText = (e.clipboardData?.getData('text') || '').trim().replace(/^["']|["']$/g, '');
        if (/^[a-zA-Z]:\\[^\n\r]+$/.test(pastedText)) {
          setFolderPathInput(pastedText);
        }

      const handleClipboardButtonClick = async (textSetter) => {
        try {

              if (imageType) {

                await ingestFileBatchNonBlocking([new File([blob], 'pasted-screenshot.png', { type: imageType })]);

          if (navigator.clipboard?.readText) {

            if (clipText) {

              if (/^[a-zA-Z]:\\[^\n\r]+$/.test(trimmed)) {

              textSetter(prev => (prev ? prev + '\n' + clipText : clipText));

      /**
       * Live SSE Streaming Analysis with Real-Time Thinking & Progress Stepper

      const runAnalysis = async (modeOverride, customFollowUp = null, overrideModel = null) => {
        setLoading(true);
        setError(null);
        setStreamingMarkdown('');
        if (overrideModel) setSelectedModel(overrideModel);
        setThinkingSteps([
          { stepId: 'session', label: 'Session & Tenant Workspace', status: 'pending', detail: 'Waiting...', logs: [], liveText: '', expanded: false },
          { stepId: 'rules', label: 'Deterministic CPA 2019 Statutory Engine', status: 'pending', detail: 'Waiting...', logs: [], liveText: '', expanded: true },
          { stepId: 'clerk', label: 'Stage A: Junior Clerk Folder Digest (Haiku 4.5 / Flash)', status: 'pending', detail: 'Waiting...', logs: [], liveText: '', expanded: true },
          { stepId: 'evidence', label: 'Evidence & Vision Payload Builder', status: 'pending', detail: 'Waiting...', logs: [], liveText: '', expanded: false },
          { stepId: 'llm', label: 'Stage B: Senior Counsel Reasoning (Sonnet / Opus 4.6)', status: 'pending', detail: 'Waiting...', logs: [], liveText: '', expanded: true }
        ]);

        try {
          let mode = modeOverride;
          let caseState = {};
          let baseNotes = '';

          if (door === 'start') {
            mode = 'messy-dump-intake';
            caseState = { role };
            baseNotes = customFollowUp || `User Role: ${role === 'complainant' ? 'Complainant (seeking refund/relief)' : 'Defender/Business (defending against unfair refund demand or claim)'}\n\nRaw Story / WhatsApp Chat:\n${storyText}`;
          } else if (door === 'midcase') {
            mode = 'midcase-battle-card';
            caseState = {
              stage,
              serviceDate,
              nextHearingDate,
              writtenVersionFiled,
              complainantEvidenceFiled,
              opEvidenceFiled,
              opEvidenceAdjournmentsGranted: Number(opAdjournments),
              proposedGapDays: 45
            };
            baseNotes = customFollowUp || midcaseNotes;
          } else if (door === 'company') {
            mode = 'company-advisor';
            caseState = { companyNeed };
            baseNotes = customFollowUp || `Need Type: ${companyNeed}\nDetails:\n${companyNotes}`;
          }

          // Zero Re-Upload Optimization:
          // If this session already exists in SQLite (`activeSession.id`), only upload NEW documents or NEW images
          // that were added after the last turn! The backend already holds the full folder + Junior Clerk Digest in SQLite.
          const unsyncedTextDocs = activeSession?.id
            ? attachedTextDocs.filter(d => !syncedDocNames.includes(d.name))
            : attachedTextDocs;

          const unsyncedImages = activeSession?.id
            ? attachedImages.filter(img => !syncedImageNames.includes(img.name))
            : attachedImages;

          const docsBundle = unsyncedTextDocs.length > 0
            ? '\n\nATTACHED FOLDER / TEXT DOCUMENTS:\n' + unsyncedTextDocs.map(d => `=== ${d.name} ===\n${d.content}`).join('\n\n')
            : '';

          const rawInput = baseNotes + docsBundle;

          const res = await fetch('/api/analyze-stream', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-nyaya-user-id': userId
            },
            body: JSON.stringify({
              userId,
              sessionId: activeSession?.id || null,
              door,
              mode,
              model: overrideModel || selectedModel,
              caseState,
              rawInput,
              images: unsyncedImages.slice(0, 10),
              folderPath: folderScanSummary?.folderPath || '',
              saveCaseTitle: caseTitle
            })
          });

          if (!res.ok || !res.body) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.error || `Request failed (${res.status})`);
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          let accumulatedMd = '';

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split('\n\n');
            buffer = parts.pop() || '';

            for (const part of parts) {
              const line = part.trim();
              if (!line.startsWith('data:')) continue;
              let evt;
              try {
                evt = JSON.parse(line.slice(5).trim());
              } catch {
                continue;
              }

              if (evt.type === 'step') {
                setThinkingSteps(prev =>
                  prev.map(s =>
                    s.stepId === evt.stepId
                      ? {
                          ...s,
                          status: evt.status,
                          detail: evt.detail,
                          logs: evt.logs || s.logs || [],
                          liveText: evt.liveText !== undefined ? evt.liveText : (s.liveText || ''),
                          expanded: evt.status === 'running' ? true : s.expanded
                        }
                      : s
                  )
                );
                if (evt.engineResult) {
                  if (evt.engineResult.inferredCaseState) {
                    applyInferredStateToForm(evt.engineResult.inferredCaseState);
                  }
                  setResult(prev => ({
                    ...(prev || {}),
                    engineResult: evt.engineResult,
                    adviceMarkdown: accumulatedMd
                  }));
                }
              } else if (evt.type === 'delta') {
                accumulatedMd += evt.delta;
                setStreamingMarkdown(accumulatedMd);
              } else if (evt.type === 'complete') {
                setResult(evt);
                setStreamingMarkdown('');
                setSyncedDocNames(attachedTextDocs.map(d => d.name));
                setSyncedImageNames(attachedImages.map(i => i.name));
                if (evt.session) {
                  setActiveSession(evt.session);
                  setCaseTitle(evt.session.title || '');
                }
                if (Array.isArray(evt.sessions)) {
                  setSessions(evt.sessions);
                }
              } else if (evt.type === 'error') {
                throw new Error(evt.error || 'Streaming error');
              }
            }
          }

          setFollowUpText('');
          await refreshConfig();
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

                  <div class="pt-3 border-t border-zinc-100 flex flex-wrap items-center justify-between gap-2">
                    <div class="flex flex-wrap items-center gap-2">
                      <label class="text-xs px-3 py-1.5 rounded-lg bg-zinc-100 hover:bg-zinc-200 text-zinc-800 cursor-pointer font-medium transition">
                        🖼️ Upload RoC Screenshot / File
                        <input
                          type="file"
                          multiple
                          accept="image/*,.txt,.md,.csv,.json"
                          class="hidden"
                          onChange={handleFileUpload}
                        />
                      </label>
                      <button
                        type="button"
                        onClick={() => handleClipboardButtonClick(setCompanyNotes)}
                        class="text-xs px-3 py-1.5 rounded-lg border border-zinc-200 hover:border-zinc-400 text-zinc-700 font-medium transition"
                      >
                        📋 Paste from Clipboard
                      </button>
                    </div>
                    <button
                      onClick={() => runAnalysis('company-advisor')}
                      disabled={loading || Boolean(ingestProgress)}
                      class="px-4 py-2 rounded-xl bg-zinc-900 text-white text-xs font-semibold hover:bg-zinc-800 transition disabled:opacity-50"
                    >
                      {loading ? 'Streaming Advice...' : 'Get Corporate Counsel Roadmap →'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== LIVE THINKING & PROGRESS STEPPER ==================== */}
            {renderLiveThinkingCard()}

            {error && (
              <div class="mt-6 p-4 rounded-2xl bg-red-50 border border-red-200 text-xs text-red-800">
                <strong>Error:</strong> {error}
              </div>
            )}

            {/* Prior turns in this session (if > 1 turn) */}
            {activeSession?.turns?.length > 1 && (
              <div class="mt-6 space-y-4">
                <div class="text-xs font-semibold uppercase tracking-wider text-zinc-400">
                  Earlier Turns in This Case ({activeSession.turns.length - 1})
                </div>
                {activeSession.turns.slice(0, -1).map((t) => (
                  <details key={t.id} class="bg-white rounded-2xl border border-zinc-200/80 p-4 shadow-sm">
                    <summary class="cursor-pointer text-xs font-semibold text-zinc-800 flex items-center justify-between">
                      <span>Turn #{t.turnIndex} · {new Date(t.createdAt).toLocaleString()} — {t.userInput.slice(0, 75)}...</span>
                      <span class="text-zinc-400 font-normal">{t.model}</span>
                    </summary>
                    <div
                      class="markdown-body mt-4 pt-3 border-t border-zinc-100"
                      dangerouslySetInnerHTML={renderFormattedMarkdown(t.assistantMarkdown)}
                    />
                  </details>
                ))}
              </div>
            )}

            {/* Live Streaming Output OR Completed Result */}
            {(streamingMarkdown || result) && (
              <div class="mt-6 bg-white rounded-2xl border border-zinc-200 p-6 space-y-5 shadow-sm">
                {result?.engineResult?.disposalPace && (
                  <div class="flex flex-wrap gap-2 pb-4 border-b border-zinc-100">
                    <span class="text-xs px-2.5 py-1 rounded-full bg-amber-50 text-amber-900 border border-amber-200 font-medium">
                      Elapsed: {result.engineResult.disposalPace.daysElapsed ?? result.engineResult.disposalPace.elapsedDays}d / {result.engineResult.disposalPace.targetDays ?? result.engineResult.disposalPace.statutoryTargetDays}d statutory target
                    </span>
                    {result.engineResult.verification && (
                      <span class={`text-xs px-2.5 py-1 rounded-full border font-medium ${
                        result.engineResult.verification.verified
                          ? 'bg-emerald-50 text-emerald-900 border-emerald-200'
                          : 'bg-red-50 text-red-900 border-red-200'
                      }`}>
                        {result.engineResult.verification.verified ? '🛡️ Record Fact-Check: PASSED' : '⚠️ Record Fact-Check: Warning'}
                      </span>
                    )}
                    {result.engineResult.matchedTactics?.map(t => (
                      <span key={t.id} class="text-xs px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 font-medium">
                        ✓ Tactic Matched: {t.title}
                      </span>
                    ))}
                  </div>
                )}

                <div
                  class="markdown-body max-w-none"
                  dangerouslySetInnerHTML={renderFormattedMarkdown(streamingMarkdown || result?.adviceMarkdown || '')}
                />

                {!loading && result && (
                  <>
                    <div class="pt-4 border-t border-zinc-100 flex flex-wrap items-center justify-between gap-2 text-xs text-zinc-500">
                      <div>
                        Model: <strong class="text-zinc-800">{result.model}</strong> ·
                        Tokens: <strong class="text-zinc-800">{result.billingEntry?.totalTokens || 0}</strong> ·
                        Call Cost: <strong class="text-emerald-700">₹{(result.billingEntry?.estimatedInr || 0).toFixed(3)}</strong> ·
                        Latency: {((result.billingEntry?.latencyMs || 0) / 1000).toFixed(1)}s
                      </div>
                      <div class="flex flex-wrap items-center gap-2">
                        {result.model !== 'claude-opus-4.6' && (
                          <button
                            onClick={() => runAnalysis(activeSession?.mode, 'Re-analyze with deep Senior Counsel reasoning: verify every date, contradiction, and statutory hook, and sharpen the courtroom script and application.', 'claude-opus-4.6')}
                            class="px-3 py-1.5 rounded-lg bg-amber-100 hover:bg-amber-200 text-amber-950 font-semibold border border-amber-300 transition"
                            title="Not satisfied? Re-run this exact case with Claude Opus 4.6 Deep Senior Counsel"
                          >
                            🧠 Escalate to Claude Opus 4.6
                          </button>
                        )}
                        <button
                          onClick={() => downloadCourtWordDoc(result.adviceMarkdown, caseTitle || 'Nyaya-Legal-Filing')}
                          class="px-3 py-1.5 rounded-lg border border-zinc-200 hover:border-zinc-400 text-zinc-800 font-medium transition"
                        >
                          📄 Export Word (.doc)
                        </button>
                        <button
                          onClick={() => printCourtReadyPdf(result.adviceMarkdown, caseTitle || 'Nyaya Legal Filing')}
                          class="px-3 py-1.5 rounded-lg border border-zinc-200 hover:border-zinc-400 text-zinc-800 font-medium transition"
                        >
                          🖨️ Print / Save PDF
                        </button>
                        <button
                          onClick={() => copyText(result.adviceMarkdown)}
                          class="px-3.5 py-1.5 rounded-lg bg-zinc-900 text-white font-medium hover:bg-zinc-800 transition"
                        >
                          {copied ? '✓ Copied' : 'Copy Markdown'}
                        </button>
                      </div>
                    </div>

                    <div class="pt-4 border-t border-zinc-200/80 space-y-2">
                      <label class="text-xs font-semibold text-zinc-700 block">
                        Continue This Case Session (Ask a follow-up or log the next hearing order)
                      </label>
                      <div class="flex flex-col sm:flex-row gap-2">
                        <input
                          type="text"
                          value={followUpText}
                          onChange={(e) => setFollowUpText(e.target.value)}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter' && followUpText.trim() && !loading) {
                              runAnalysis(activeSession?.mode, followUpText.trim());
                            }
                          }}
                          placeholder="e.g., What if the Opposite Party offers a 50% settlement in court tomorrow?"
                          class="flex-1 text-xs px-3.5 py-2.5 rounded-xl border border-zinc-200 bg-zinc-50 text-zinc-900 focus:outline-none focus:border-zinc-400"
                        />
                        <button
                          onClick={() => runAnalysis(activeSession?.mode, followUpText.trim())}
                          disabled={loading || !followUpText.trim()}
                          class="px-4 py-2.5 rounded-xl bg-zinc-900 text-white text-xs font-semibold hover:bg-zinc-800 transition disabled:opacity-40 whitespace-nowrap"
                        >
                          {loading ? 'Streaming...' : 'Ask Follow-Up in Session →'}
                        </button>
                      </div>
                    </div>
                  </>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
