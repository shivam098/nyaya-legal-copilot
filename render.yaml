services:
  - type: web
    name: nyaya-legal-copilot
    runtime: node
    plan: starter
    buildCommand: npm run check
    startCommand: node ui/server.mjs
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PORT
        value: 4173
